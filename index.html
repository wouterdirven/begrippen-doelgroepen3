<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Begrippenspel - Orthopedagogie KDG</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f4f8; min-height: 100vh; padding: 20px; }

  /* ===== STARTSCHERM ===== */
  #start-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    gap: 32px;
  }
  #start-screen h1 { font-size: 2rem; color: #2d3748; text-align: center; }
  #start-screen p { color: #4a5568; font-size: 1rem; text-align: center; }
  #source-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    width: 100%;
    max-width: 640px;
  }
  .source-btn {
    background: white;
    border: 2px solid #cbd5e0;
    border-radius: 16px;
    padding: 28px 20px;
    cursor: pointer;
    font-size: 1.05rem;
    font-weight: bold;
    color: #2d3748;
    transition: border-color 0.2s, background 0.2s, transform 0.1s;
    text-align: center;
    line-height: 1.4;
  }
  .source-btn:hover { border-color: #667eea; background: #ebf4ff; transform: translateY(-2px); }
  .source-btn .icon { font-size: 2rem; margin-bottom: 10px; }
  .source-btn .count { font-size: 0.8rem; color: #718096; font-weight: normal; margin-top: 6px; }

  /* ===== SPELTYPE SCHERM ===== */
  #mode-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    gap: 32px;
  }
  #mode-screen h1 { font-size: 1.6rem; color: #2d3748; text-align: center; }
  #mode-screen p { color: #4a5568; text-align: center; }
  #mode-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    width: 100%;
    max-width: 500px;
  }
  .mode-btn {
    background: white;
    border: 2px solid #cbd5e0;
    border-radius: 16px;
    padding: 32px 20px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: bold;
    color: #2d3748;
    transition: border-color 0.2s, background 0.2s, transform 0.1s;
    text-align: center;
    line-height: 1.5;
  }
  .mode-btn:hover { border-color: #667eea; background: #ebf4ff; transform: translateY(-2px); }
  .mode-btn .mode-icon { font-size: 2.5rem; margin-bottom: 12px; }
  .mode-btn .mode-desc { font-size: 0.8rem; color: #718096; font-weight: normal; margin-top: 6px; }

  /* ===== GEDEELDE GAME HEADER ===== */
  .game-screen { display: none; }
  .game-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 900px;
    margin: 0 auto 10px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .back-btn {
    background: #e2e8f0;
    color: #4a5568;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .back-btn:hover { background: #cbd5e0; }
  h1.game-title { text-align: center; color: #2d3748; font-size: 1.3rem; flex: 1; }
  .score-line { text-align: center; color: #4a5568; margin-bottom: 6px; font-size: 0.95rem; max-width: 900px; margin: 0 auto 6px; }
  .round-info { text-align: center; color: #667eea; margin-bottom: 16px; font-size: 0.9rem; font-weight: bold; max-width: 900px; margin: 0 auto 16px; }

  /* Progress balk */
  .progress-wrap {
    max-width: 900px;
    margin: 0 auto 12px;
    background: #e2e8f0;
    border-radius: 8px;
    height: 8px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: #667eea;
    border-radius: 8px;
    transition: width 0.4s;
    width: 0%;
  }

  /* ===== KOPPELSPEL ===== */
  #match-game-container {
    position: relative;
    display: flex;
    justify-content: space-between;
    gap: 40px;
    max-width: 900px;
    margin: 0 auto;
  }
  #svg-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .column { flex: 1; display: flex; flex-direction: column; gap: 10px; z-index: 1; }
  .card {
    background: white;
    border: 2px solid #cbd5e0;
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1.4;
    transition: border-color 0.2s, background 0.2s;
    user-select: none;
    min-height: 52px;
    display: flex;
    align-items: center;
  }
  .card:hover { border-color: #667eea; background: #ebf4ff; }
  .card.selected { border-color: #667eea; background: #ebf4ff; box-shadow: 0 0 0 3px #667eea55; }
  .card.correct { border-color: #48bb78; background: #f0fff4; pointer-events: none; }
  .card.wrong { border-color: #fc8181; background: #fff5f5; }

  /* ===== INVULSPEL ===== */
  #type-game-container {
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .type-card {
    background: white;
    border: 2px solid #cbd5e0;
    border-radius: 14px;
    padding: 20px;
    transition: border-color 0.3s;
  }
  .type-card.correct { border-color: #48bb78; background: #f0fff4; }
  .type-card.wrong-flash { border-color: #fc8181; background: #fff5f5; }
  .type-card.revealed { border-color: #ed8936; background: #fffaf0; }
  .def-text {
    font-size: 0.9rem;
    color: #4a5568;
    line-height: 1.5;
    margin-bottom: 14px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .term-input {
    flex: 1;
    min-width: 180px;
    border: 2px solid #cbd5e0;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .term-input:focus { border-color: #667eea; }
  .term-input:disabled { background: #f7fafc; color: #4a5568; }
  .check-btn {
    background: #667eea;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .check-btn:hover { background: #5a67d8; }
  .reveal-btn {
    background: #e2e8f0;
    color: #4a5568;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .reveal-btn:hover { background: #cbd5e0; }
  .feedback-text {
    margin-top: 10px;
    font-size: 0.85rem;
    font-weight: bold;
    min-height: 20px;
  }
  .feedback-text.ok { color: #38a169; }
  .feedback-text.fout { color: #e53e3e; }
  .feedback-text.hint { color: #dd6b20; }

  /* Gedeelde knoppen */
  .controls { text-align: center; margin-top: 24px; }
  .action-btn {
    background: #667eea;
    color: white;
    border: none;
    padding: 10px 28px;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    margin: 4px;
  }
  .action-btn:hover { background: #5a67d8; }
  .action-btn.secondary { background: #e2e8f0; color: #4a5568; }
  .action-btn.secondary:hover { background: #cbd5e0; }
  .message { text-align: center; margin-top: 16px; font-size: 1.1rem; font-weight: bold; color: #2d3748; min-height: 28px; }

  @media (max-width: 600px) {
    #source-buttons { grid-template-columns: 1fr; }
    #mode-buttons { grid-template-columns: 1fr; }
    #match-game-container { flex-direction: column; gap: 16px; }
    #svg-layer { display: none; }
  }
</style>
</head>
<body>

<!-- STARTSCHERM: kies bron -->
<div id="start-screen">
  <h1>Begrippenspel</h1>
  <p>Kies een onderwerp om te oefenen.</p>
  <div id="source-buttons"></div>
</div>

<!-- SPELTYPE SCHERM: kies speltype -->
<div id="mode-screen">
  <button class="back-btn" onclick="goToStart()">&#8592; Terug</button>
  <h1 id="mode-title">Kies een speltype</h1>
  <p id="mode-subtitle"></p>
  <div id="mode-buttons">
    <button class="mode-btn" onclick="startMatchGame()">
      <div class="mode-icon">🔗</div>
      <div>Koppelspel</div>
      <div class="mode-desc">Verbind termen met de juiste definitie</div>
    </button>
    <button class="mode-btn" onclick="startTypeGame()">
      <div class="mode-icon">✏️</div>
      <div>Invulspel</div>
      <div class="mode-desc">Typ de term bij de definitie</div>
    </button>
  </div>
</div>

<!-- KOPPELSPEL -->
<div id="match-screen" class="game-screen">
  <div class="game-header">
    <button class="back-btn" onclick="goToMode()">&#8592; Terug</button>
    <h1 class="game-title" id="match-title"></h1>
    <div style="width:80px"></div>
  </div>
  <p class="score-line">Score: <span id="match-correct">0</span> / <span id="match-total">0</span></p>
  <div class="progress-wrap"><div class="progress-bar" id="match-progress"></div></div>
  <p class="round-info" id="match-round-info"></p>
  <div id="match-game-container">
    <svg id="svg-layer"></svg>
    <div class="column" id="left-col"></div>
    <div class="column" id="right-col"></div>
  </div>
  <div class="message" id="match-message"></div>
  <div class="controls">
    <button class="action-btn" onclick="matchNextRound()" id="match-next-btn" style="display:none">Volgende ronde</button>
    <button class="action-btn secondary" onclick="resetMatchGame()">Opnieuw</button>
  </div>
</div>

<!-- INVULSPEL -->
<div id="type-screen" class="game-screen">
  <div class="game-header">
    <button class="back-btn" onclick="goToMode()">&#8592; Terug</button>
    <h1 class="game-title" id="type-title"></h1>
    <div style="width:80px"></div>
  </div>
  <p class="score-line">Score: <span id="type-correct">0</span> / <span id="type-total">0</span></p>
  <div class="progress-wrap"><div class="progress-bar" id="type-progress"></div></div>
  <p class="round-info" id="type-round-info"></p>
  <div id="type-game-container"></div>
  <div class="message" id="type-message"></div>
  <div class="controls">
    <button class="action-btn" onclick="typeNextRound()" id="type-next-btn" style="display:none">Volgende ronde</button>
    <button class="action-btn secondary" onclick="resetTypeGame()">Opnieuw</button>
  </div>
</div>

<script>
const allSources = {"Doelgroepen 3 - Deel 1": [{"term": "ACEs (Adverse Childhood Experiences)", "def": "Ongunstige kind- en jeugdervaringen voor de leeftijd van 18 jaar met een duidelijke negatieve impact op de verdere ontwikkeling."}, {"term": "Kaiser-onderzoek / ACE-studie", "def": "Baanbrekend onderzoek van Felitti en Anda (1998) naar de samenhang tussen ongunstige kinderervaringen en gezondheid op volwassen leeftijd."}, {"term": "Nadine Burke Harris", "def": "Pionier in ACE-onderzoek, oprichter van het Center for Youth Wellness, auteur van 'The Deepest Well'."}, {"term": "Enkelvoudig trauma", "def": "Eenmalige en onverwachte ingrijpende gebeurtenis, bv. een ernstig verkeersongeval."}, {"term": "Meervoudig trauma", "def": "Combinatie van verschillende ingrijpende en belastende gebeurtenissen op meerdere levensdomeinen."}, {"term": "Kleine 't' trauma", "def": "Cumulatief traumatisch effect door dagelijkse belastende ervaringen die elk op zichzelf niet acuut zijn, bv. pesterijen."}, {"term": "Complex trauma", "def": "Meervoudig trauma waarbij zorgfiguren betrokken zijn, met herhaalde of langdurige blootstelling. Ook: hechtingstrauma of ontwikkelingstrauma."}, {"term": "Hechtingstrauma", "def": "Trauma dat ontstaat wanneer de eigen zorgfiguur tegelijk bron van gevaar en veiligheid is."}, {"term": "Ontwikkelingstrauma", "def": "Andere naam voor complex trauma: langdurige traumatische ervaringen die de ontwikkeling van het kind beïnvloeden."}, {"term": "PACEs (Protective and Compensatory Experiences)", "def": "Beschermende en compenserende kind- en jeugdervaringen die veerkracht opbouwen en de negatieve effecten van ACEs kunnen compenseren."}, {"term": "Protectieve factoren", "def": "Beschermende factoren op micro-, meso- of macroniveau die een gezonde ontwikkeling bevorderen ondanks aanwezige risico's."}, {"term": "Intergenerationele overdracht", "def": "Het doorgeven van problematiek, patronen of risicofactoren van ouders op kinderen, via genetische en sociale mechanismen."}, {"term": "Cumulatie-effect", "def": "Hoe meer ACEs iemand meemaakt, hoe sterker het negatieve effect op de ontwikkeling en gezondheid."}, {"term": "Langdurige blootstelling aan stress veroorzaakt toxische stress", "def": "een overmaat aan cortisol en adrenaline zonder beschermende factoren. Dit beïnvloedt de hersenontwikkeling: de amygdala (angstreactie), de prefrontale cortex (emotieregulatie) en de hippocampus (geheugen) ontwikkelen anders. Dit vergroot het risico op leer- en gedragsproblemen en gezondheidsproblemen."}, {"term": "Toxische stress", "def": "Aanhoudende activering van het stresssysteem door langdurige ACEs, zonder voldoende beschermende factoren. Leidt tot een overmaat aan cortisol en adrenaline met gevolgen voor de hersenontwikkeling."}, {"term": "Epigenetische veranderingen", "def": "Door ACEs veroorzaakte veranderingen in hoe genen worden gelezen, zonder wijziging van de DNA-volgorde zelf. Soms overdraagbaar op volgende generaties."}, {"term": "ACE-piramide", "def": "Visualisatie van hoe toxische stress via hersenontwikkeling, sociaal-emotionele problemen en risicogedrag leidt tot ziekte en vroegtijdig overlijden."}, {"term": "Hartmodel van PACEs", "def": "Visualisatie van hoe PACEs als steunende relaties en hulpbronnen bijdragen aan een gezonde ontwikkeling, het omgekeerde van de ACE-piramide."}, {"term": "Risicofactor", "def": "Een factor die de kans op een probleem vergroot, bv. armoede, mishandeling of psychisch kwetsbare ouder."}, {"term": "Intergenerationeel trauma", "def": "Trauma dat doorwerkt van generatie op generatie via biologische, psychologische en sociale mechanismen."}, {"term": "Holistische benadering", "def": "Benadering waarbij de mens als geheel wordt bekeken, verder dan de beperking of stoornis, inclusief individuele kenmerken en bredere context."}, {"term": "Microniveau", "def": "Het niveau van het individu en de directe omgeving: gezin, primaire verzorgers, directe relaties."}, {"term": "Mesoniveau", "def": "Het niveau van bredere netwerken: school, buurt, sociaal netwerk, ondersteunende diensten."}, {"term": "Macroniveau", "def": "Het maatschappelijke en beleidsmatige niveau: normen, wetgeving, maatschappelijke structuren."}, {"term": "Trauma-informed opvoedingsinterventies", "def": "Interventies gericht op ouders die zelf ACEs meemaakten, met focus op intergenerationele patronen en hun impact op de opvoeding."}, {"term": "Valkuilen zijn", "def": "te veel focussen op het optellen van ACEs in plaats van het inzetten van PACEs, uitholling van begrippen zoals trauma of toxische stress, te enge preventielogica die ouders schuldgevoelens geeft, en het overmatig gebruik van containerbegrippen zoals veerkracht zonder theoretische onderbouw."}, {"term": "Uitholling", "def": "Risico waarbij begrippen zoals trauma, veerkracht of toxische stress te breed worden toegepast, waardoor hun specifieke betekenis en nuttigheid afneemt."}, {"term": "Veerkracht", "def": "Dynamisch proces waarbij individuen zich positief aanpassen aan tegenspoed, in wisselwerking met de omgeving. Geen vaste eigenschap maar versterkbaar via bouwstenen."}, {"term": "De zelfgekozen informele mentor", "def": "Een volwassene buiten het gezin die het kind zelf kiest als steunfiguur, bv. een buurman, leraar of oom. Vergroot de veerkracht als ouders niet beschikbaar zijn."}, {"term": "JIM (Jouw Ingebrachte Mentor)", "def": "Aanpak als alternatief voor uithuisplaatsing waarbij de jongere zelf een informele mentor uit het eigen netwerk kiest, ondersteund door een professioneel team."}, {"term": "Professionele betrokkenheid", "def": "De rol van het professionele team binnen JIM: niet zelf de mentor zijn, maar ondersteunen, coachen en begeleiden van de zelfgekozen mentor en het gezin."}, {"term": "Circulaire zorg", "def": "Principe waarbij iemand eerst zorgvrager is en later kan uitgroeien tot hulpbieder, en omgekeerd. Centraal in de JIM-aanpak."}, {"term": "Family Finding / Family Seeing", "def": "Aanpak gericht op het inbedden van kinderen in een levenslang netwerk via het zoeken en herstellen van banden met familie en kennissen. In Vlaanderen ook 'Family Seeing' genoemd."}, {"term": "GMCP (Gezinnen met Meervoudige en Complexe Problemen)", "def": "Gezinnen met langdurige sociaaleconomische en psychosociale kwetsbaarheden waarbij eerdere hulpverlening geen duurzaam resultaat opleverde."}, {"term": "Multistressgezinnen", "def": "Alternatieve benaming voor GMCP waarbij de nadruk ligt op de ervaren stress en belasting van het gezin, in plaats van de problemen."}, {"term": "Multidimensionaal en multicausaal", "def": "Beschrijving van GMCP-problematiek: problemen spelen op meerdere domeinen tegelijk en hebben meerdere onderling beïnvloedende oorzaken."}, {"term": "Diversiteitsdenken", "def": "Benadering die de nadruk legt op de meervoudige identiteiten die elke persoon heeft en hoe deze elkaar doorkruisen doorheen het leven."}, {"term": "Kruispuntdenken / Intersectioneel denken", "def": "Manier van denken over verschil die vertrekt vanuit de samenhang van kenmerken zoals gender, etniciteit, klasse en seksualiteit die iemands positie bepalen."}, {"term": "Internaliserend gedrag", "def": "Naar binnen gericht gedrag zoals angst, depressie, teruggetrokkenheid en somatische klachten."}, {"term": "Externaliserend gedrag", "def": "Naar buiten gericht gedrag zoals agressie, impulsiviteit en gedragsproblemen."}, {"term": "Sociaal construct", "def": "Een begrip of categorie die maatschappelijk geconstrueerd is en evolueert naargelang normen en waarden veranderen."}, {"term": "Risicofactoren", "def": "Factoren die de kans op het ontstaan of verergeren van problemen verhogen, bv. armoede, verslaving, laag opleidingsniveau."}, {"term": "Omgevingskenmerken als risicofactor", "def": "Buurtkenmerken, sociale isolatie en gebrek aan voorzieningen die bijdragen aan het risico op problemen in het gezin."}, {"term": "Kindfactoren", "def": "Kenmerken van het kind zelf die het risico op mishandeling of problemen verhogen of juist verlagen, bv. prematuriteit, temperament of verstandelijke beperking."}, {"term": "Schoolproblemen", "def": "Problemen op school zoals pesten, spijbelen of vroegtijdig schoolverlaten die samenhangen met de GMCP-context en het risico op verdere problemen verhogen."}, {"term": "Los van de doelgroep werken altijd", "def": "goede relatie begeleider-cliënt, motivatie van de cliënt, een aanpak die aansluit bij de hulpvraag, structuur in de interventie en uitvoering volgens protocol. Op organisatieniveau zijn monitoring, supervisie en haalbare caseload (max. 10 cliënten) van belang."}, {"term": "Algemene werkzame factoren", "def": "Factoren die altijd bijdragen aan effectieve hulpverlening, ongeacht de doelgroep: goede relatie, motivatie, passende aanpak, structuur en protocol."}, {"term": "Specifiek voor GMCP", "def": "intensieve en langdurige hulp, grondige analyse van krachten en problemen, praktische hulp in de leefomgeving (huisbezoeken), aandacht voor sociaal netwerk, goede ketensamenwerking met één coördinerende hulpverlener per gezin en nazorg na afsluiting."}, {"term": "Specifieke werkzame factoren", "def": "Factoren die specifiek effectief zijn bij GMCP: intensieve hulp, praktische aanpak, betrokkenheid netwerk, ketensamenwerking en één plan per gezin."}, {"term": "Gemandateerd", "def": "Hulpverlening waarbij een externe autoriteit (bv. de jeugdrechter) de begeleiding oplegt, in tegenstelling tot vrijwillige hulp."}, {"term": "Samenwerking", "def": "Vereiste ketensamenwerking waarbij alle betrokken diensten rond een gezin werken via één gedeeld plan en één coördinator."}, {"term": "Orde op zaken model", "def": "Strategie voor gezinnen die toegang tot basisvoorzieningen missen: hulpverlener begeleidt bij administratie, schulden en wonen."}, {"term": "Stut en steun model", "def": "Langdurige intensieve begeleiding voor gezinnen met chronische problematiek waarbij geen zelfstandige verbetering verwacht wordt."}, {"term": "Direct (gedwongen) hulpaanbod", "def": "Strategie voor urgente situaties waarbij hulp opgedrongen of verplicht wordt, bv. bij veiligheidsrisico's."}, {"term": "Refresh model", "def": "Nazorgstrategie om behaalde resultaten te bewaken en terugval te vermijden na afsluiting van intensieve begeleiding."}, {"term": "Maatschappelijke Noodzaak (MaNo)", "def": "Vlaams instrument om te bepalen wanneer de maatschappij ingrijpt in een gezin zonder toestemming van de ouders."}, {"term": "KOPP-kinderen", "def": "Kinderen van Ouders met Psychiatrische Problemen. Geen diagnose maar een contextbeschrijving: gewone kinderen in bijzondere omstandigheden, bij wie minstens één ouder een DSM-aandoening heeft."}, {"term": "Chronisch karakter", "def": "De psychische problemen van de ouder duren lange tijd, waardoor kinderen langdurig worden blootgesteld aan de gevolgen."}, {"term": "Dark number", "def": "Het werkelijke maar onbekende aantal gevallen dat niet wordt geregistreerd bij hulpverleningsinstanties, vermoedelijk veel hoger dan de officiële cijfers."}, {"term": "Kookpotmetafoor", "def": "Metafoor van Brenda Froyen voor het multicausale model van psychische kwetsbaarheid: de pot is de biologische kwetsbaarheid, de inhoud de levensgeschiedenis, het vuur de huidige context en stress."}, {"term": "Een multicausaal model", "def": "Verklaringsmodel dat psychische problemen toeschrijft aan een combinatie van biologische, psychologische en sociale factoren, niet aan één oorzaak."}, {"term": "Parentificatie", "def": "Situatie waarbij een kind de zorgrol van de ouder overneemt, bv. door te zorgen voor jongere broers/zussen of emotioneel voor de ouder in te staan."}, {"term": "Kindreflex / Vlaamse Kindreflex", "def": "Basishouding waarbij hulpverleners, ongeacht werksetting, steeds nagaan of er kinderen betrokken zijn bij de problematiek van de cliënt en wat de impact op hen is."}, {"term": "Verbeteren van ouderschap en ouder-kindinteractie. Voorbeeld", "def": "Family Talk Intervention van Beardslee gericht op open communicatie over psychische problemen in het gezin."}, {"term": "Ondersteuning en deskundigheidsbevordering van hulpverleners", "def": "Vorming, supervisie en intervisie die hulpverleners uitrusten om signalen bij KOPP-kinderen te herkennen en erop te reageren."}, {"term": "Familiereflex", "def": "Basishouding waarbij hulpverleners steeds oog hebben voor het hele gezinssysteem en de naasten van hun cliënten, niet alleen de cliënt zelf."}, {"term": "Psycho-educatie", "def": "Het in begrijpelijke taal informeren van kinderen (en ouders) over de psychische aandoening, om verwarring, schaamte en schuldgevoelens te verminderen."}, {"term": "Lotgenotencontact", "def": "Contact met anderen die een gelijkaardige ervaring hebben meegemaakt. Verlaagt isolement, versterkt het gevoel 'niet alleen te zijn' en biedt herkenning en steun."}, {"term": "Hulp aan KOPP-kinderen moet integraal zijn", "def": "gericht op ouder, ouder-kindrelatie en bredere omgevingsfactoren. Iedere professional die met kinderen werkt kan een rol opnemen door signalen te herkennen en het gesprek aan te gaan."}, {"term": "Kindermishandeling is geen zwart-wit begrip maar een sociaal construct", "def": "het wordt bepaald door maatschappelijke normen en waarden die evolueren. De grens tussen aanvaardbaar opvoedingsgedrag en mishandeling is niet altijd scherp. Slachtoffers worden ook 'overlevers' genoemd om hun veerkracht te benadrukken."}, {"term": "Definitie Decreet Integrale Jeugdhulp", "def": "'Elke vorm van lichamelijk, psychisch of seksueel geweld waarvan een minderjarige het slachtoffer is, actief door schadelijk optreden of passief door ernstige nalatigheid, van ouders of personen in een afhankelijkheidsrelatie.' Vlaamse vertrouwenscentra voegen toe dat de gevolgen de ontwikkeling van het kind ernstig in gevaar brengen."}, {"term": "Sociaal construct (kindermishandeling)", "def": "Kindermishandeling als begrip is gevormd door maatschappelijke normen en waarden die evolueren doorheen de tijd en per cultuur kunnen verschillen."}, {"term": "Verontrustende opvoedingssituatie (VOS)", "def": "Eerdere Vlaamse term voor situaties waarbij de ontwikkeling van het kind ernstig in het gedrang komt. Vaak vervangen door de ACEs-terminologie."}, {"term": "Meest zichtbare vorm", "def": "het toebrengen van lichamelijke letsels door bijten, slaan, trappen, verbranden, snijden, vergiftigen of verminken. Specifieke vormen zijn Shaken Baby Syndrome, Münchausen by Proxy en andere."}, {"term": "Verschillende vormen van kindermishandeling", "def": "Fysieke mishandeling, emotionele mishandeling, verwaarlozing, seksueel misbruik en intrafamiliaal geweld zijn de vijf erkende vormen."}, {"term": "Eenzijdig machtspatroon", "def": "Kenmerk van emotionele mishandeling: de ouder of zorgfiguur heeft systematisch meer macht en gebruikt die om het kind te controleren, intimideren of ondermijnen."}, {"term": "Seksueel misbruik", "def": "Het betrekken van een kind in seksuele activiteiten waarbij de leeftijds- of machtsverschillen het kind beletten om te weigeren of toestemming te geven."}, {"term": "IFG (Intrafamiliaal geweld)", "def": "Geweld dat binnen de huiselijke kring plaatsvindt: partnergeweld, geweld op kinderen of geweld tussen familieleden."}, {"term": "Vuistregel", "def": "de 1/3e-regel: Vuistregel die stelt dat slechts een derde van de gevallen van kindermishandeling effectief gemeld wordt."}, {"term": "Oudere modellen (jaren 1960-70) schreven kindermishandeling toe aan één oorzaak", "def": "psychiatrische modellen (persoonlijkheid van de ouder) of sociologische modellen (armoede, werkloosheid). Deze aanpak bleek onvolledig."}, {"term": "Monocausale verklaringsmodellen", "def": "Verklaringsmodellen die kindermishandeling toeschrijven aan één enkele oorzaak, bv. een psychiatrische stoornis of armoede. Nu achterhaald."}, {"term": "Socio-economische factoren", "def": "Maatschappelijke risicofactoren zoals werkloosheid, armoede en lage opleiding die het risico op kindermishandeling verhogen."}, {"term": "Gezinsfactoren", "def": "Factoren binnen het gezinssysteem zoals huwelijksconflicten, partnergeweld en stiefgezinproblematiek die het risico op mishandeling verhogen."}, {"term": "Omgevingsfactoren", "def": "Factoren in de bredere omgeving zoals werkstress, buurtproblematiek en sociale isolatie die bijdragen aan het risico op kindermishandeling."}, {"term": "Gebaseerd op Bronfenbrenner", "def": "kindermishandeling is een opvoedingsprobleem beïnvloed door meerdere lagen. Factoren zijn: persoon van de ouder, kenmerken van het kind, sociaal netwerk, voorgeschiedenis, partnerrelatie en werkomstandigheden. Alles rondom het kind is met elkaar verbonden."}, {"term": "Ecologisch model van Belsky", "def": "Model waarbij kindermishandeling als opvoedingsprobleem wordt gezien, beïnvloed door meerdere lagen van invloeden rondom het kind en gezin, geïnspireerd op Bronfenbrenner."}, {"term": "Draagkracht en draaglast / balansmodel", "def": "Model waarbij een verstoring van het evenwicht tussen wat een gezin aankan (draagkracht) en de opgestapelde stressoren (draaglast) kan leiden tot kindermishandeling."}, {"term": "Gevolgen van kindermishandeling", "def": "Lichamelijke, psychosociale, gedragsmatige en maatschappelijke gevolgen op korte en lange termijn, inclusief intergenerationele overdracht."}, {"term": "Gericht op de volledige bevolking om nieuwe gevallen te voorkomen. Voorbeelden", "def": "Triple P-opvoedingsprogramma en programma's over het herkennen van seksueel misbruik."}, {"term": "Primaire preventieprogramma's", "def": "Preventieprogramma's gericht op de volledige bevolking om nieuwe gevallen van kindermishandeling te voorkomen."}, {"term": "Secundaire preventie", "def": "Preventie gericht op gedetecteerde risicogezinnen om mishandeling te voorkomen voordat ze plaatsvindt, bv. via homevisiting."}, {"term": "Drie aannames", "def": "(1) alle ouders willen het beste voor hun kind, (2) ouderschap maakt kwetsbaar, (3) ouders zijn eindverantwoordelijk. Hulpverleners sluiten aan bij wat de ouder belangrijk vindt, ook in mishandelingssituaties."}, {"term": "Orthopedagogisch grondplan", "def": "Kader dat hulpverleners helpt holistisch te kijken naar elk hulpverleningstraject, met aandacht voor vraag-aanbodafstemming op meerdere niveaus."}, {"term": "Signalen zijn aspecifiek. Vier categorieën", "def": "lichamelijk welzijn, gedrag van het kind, gedrag van de ouders en gezinssituatie. Het gaat om een optelsom van waarnemingen en een gevoeligheid voor signalen."}, {"term": "Erkenning erkent", "def": "Principe dat erkenning van pijn en leed essentieel is voor herstel, zonder dat de ernst vergeleken of gewogen moet worden."}, {"term": "VECK (Vlaams Expertisecentrum Kindermishandeling)", "def": "Partnerorganisatie van de Vlaamse overheid die bouwt aan gepaste omgang met kindermishandeling en de Vlaamse Kindreflex ondersteunt."}, {"term": "Methodiek die werkt met drie centrale vragen", "def": "wat zijn de zorgen, wat gaat er goed en wat moet er verder ontwikkeld worden. Kijkt naar veiligheids- en krachtelementen in het gezin naast de risico's."}, {"term": "Signs of Safety", "def": "Methodiek met drie centrale vragen: zorgen, wat gaat goed, wat moet ontwikkeld worden. Werkt naast risico's ook met veiligheids- en krachtelementen in het gezin."}, {"term": "Drie centrale vragen", "def": "Kernvragen in Signs of Safety: (1) Wat zijn de zorgen? (2) Wat gaat er goed? (3) Wat moet er verder ontwikkeld worden?"}, {"term": "Op één plek", "def": "Principe van het Family Justice Center / Veilig Huis: alle hulp voor slachtoffers van intrafamiliaal geweld wordt gecoördineerd vanuit één locatie."}], "Doelgroepen 3 - Deel 2": [{"term": "Gedrags- en emotionele problemen", "def": "Overkoepelende term voor kinderen die zichtbaar ongewoon gedrag vertonen of afwijkende emoties laten zien, los van ernst, oorzaak of context."}, {"term": "Gedragsproblemen", "def": "Breed begrip voor gedragingen van mild (prikkelbaar, opstandig) tot ernstig (agressief, antisociaal). Geen diagnose, maar een symptoom van een onderliggend probleem."}, {"term": "Externaliserend probleemgedrag", "def": "Naar buiten gericht gedrag: agressie, woede-uitbarstingen, hyperactiviteit, normoverschrijdend gedrag. Zichtbaar en storend voor de omgeving. Vaker bij jongens."}, {"term": "Internaliserend probleemgedrag", "def": "Naar binnen gericht gedrag: angst, depressie, piekeren, psychosomatische klachten, teruggetrokken gedrag. Minder zichtbaar, treft vooral het kind zelf. Vaker bij meisjes."}, {"term": "Een schaal", "def": "Gedragsproblemen zijn geen zwart-wit begrip, maar een spectrum afhankelijk van ernst, frequentie en impact."}, {"term": "Lichte en tijdelijke gedragsproblemen", "def": "Reacties op nieuwe situaties of fasegebonden gedrag (bijv. opstandigheid in de puberteit). Maakt deel uit van een normale ontwikkeling."}, {"term": "Ernstige en langdurige gedragsproblemen", "def": "Gedragingen met significante impact op het kind en zijn omgeving. Aanwezig gedurende langere tijd (minstens 6 maanden)."}, {"term": "Frequentie", "def": "Hoe vaak het probleemgedrag voorkomt. Dagelijks grensoverschrijdend gedrag weegt zwaarder dan een eenmalige uitbarsting."}, {"term": "Impact op de omgeving", "def": "De gevolgen van het gedrag voor gezin, vrienden, school en andere contexten."}, {"term": "Het ontwikkelingsperspectief", "def": "Beoordeel gedrag altijd in relatie tot de leeftijd en ontwikkelingsfase van het kind."}, {"term": "De continuümgedachte", "def": "Gedrag situeert zich op een schaal. Er is geen scherpe grens tussen normaal en problematisch."}, {"term": "De context", "def": "Gedrag moet beoordeeld worden binnen de situatie waarin het zich voordoet."}, {"term": "De informant", "def": "Wie signaleert het gedrag? Ouders, leerkrachten en hulpverleners kunnen gedrag anders ervaren."}, {"term": "Vroege starters of jonge beginners", "def": "Kinderen die al op jonge leeftijd antisociaal gedrag vertonen. Hebben een moeilijker temperament, genetische risicofactoren en groeien vaker op in gezinnen waar de opvoeding niet optimaal verloopt. Dit gedrag houdt vaak aan bij het ouder worden."}, {"term": "Laatbloeiers", "def": "Personen die pas in de puberteit moeilijk gedrag vertonen. Dit gedrag is vaak van voorbijgaande aard. Ze hebben tijdens de kinderjaren voldoende sociaal gewenst gedrag verworven om later op terug te vallen."}, {"term": "Monocausale verklaringsmodellen", "def": "Verklaren gedrag vanuit één dominante oorzaak, hetzij in het kind (nature) hetzij in de omgeving (nurture). Vandaag als beperkt beschouwd, maar bieden nog steeds specifieke inzichten."}, {"term": "Multicausale modellen", "def": "Verklaren gedrags- en emotionele problemen als het resultaat van een complexe interactie tussen biologische, psychologische en omgevingsfactoren."}, {"term": "Neuroanatomische invalshoek", "def": "Gedragsproblemen worden verklaard door disfuncties in hersenstructuren, zoals het limbisch systeem dat betrokken is bij gedragsregulatie."}, {"term": "Neurofunctionele invalshoek", "def": "Gedragsproblemen worden verklaard door niet-optimale activatie van hersenregio's."}, {"term": "Neurochemische invalshoek", "def": "Gedrag wordt beïnvloed door chemische processen in de hersenen. Verstoringen zoals verhoogde cortisolniveaus kunnen leiden tot problematisch gedrag."}, {"term": "Gedragsgenetica", "def": "Onderzoekt de erfelijkheid van gedragsproblemen. Kijkt of bepaald gedrag vaker in families voorkomt dan op basis van toeval verwacht wordt."}, {"term": "Algemene conclusie", "def": "Gedrag is gedeeltelijk biologisch bepaald, maar biologische modellen reduceren gedrag tot het individu en negeren de context."}, {"term": "Coërciviteit", "def": "Negatieve interactiecyclus tussen ouder en kind waarbij gedrag wederzijds wordt versterkt. Leidt tot een negatieve spiraal. Wordt ook \"de dans van Patterson\" genoemd."}, {"term": "De dans van Patterson", "def": "Een kind gebruikt ongewenst gedrag (zeuren, schreeuwen) om iets te krijgen of straf te vermijden. Ouders geven toe om conflicten te vermijden. Beide gedragingen worden onbedoeld bekrachtigd."}, {"term": "Overaccentuering", "def": "Kinderen met gedragsproblemen vragen om specifieke opvoeding: bepaalde aspecten van het normale opvoedingsproces worden sterker benadrukt."}, {"term": "Specifiek opvoeden", "def": "Aspecten van het normale opvoedingsproces overaccentueren, afgestemd op de specifieke noden van het kind."}, {"term": "Gedrag wordt verklaard vanuit een samenspel van factoren. Drie uitgangspunten", "def": "(1) multicausaliteit, (2) belang van risico- en protectieve factoren, (3) cumulatiehypothese."}, {"term": "Drie uitgangspunten van multicausale modellen", "def": "Multicausaliteit, belang van risico- en protectieve factoren, en cumulatiehypothese vormen de basis van multicausaal denken."}, {"term": "Risicofactoren", "def": "Factoren die de kans vergroten dat gedragsproblemen ontstaan of in stand blijven."}, {"term": "Protectieve factoren", "def": "Beschermende factoren die het ontstaan of de voortzetting van gedragsproblemen kunnen beperken of verhinderen."}, {"term": "Cumulatiehypothese", "def": "Hoe meer risicofactoren en hoe minder protectieve factoren aanwezig zijn, hoe groter de kans op gedragsproblemen."}, {"term": "Biopsychosociaal model", "def": "Model dat biologische, psychologische en omgevingsfactoren in interactie bekijkt om gedragsproblemen te verklaren."}, {"term": "Risico- en protectieve factoren bevinden zich op drie niveaus", "def": "het kind (bijv. temperament, IQ), de ouders/het gezin (bijv. opvoedingsstijl) en de bredere omgeving (bijv. schoolklimaat, armoede). Risicofactoren leiden niet automatisch tot problemen; protectieve factoren kunnen compenserend werken."}, {"term": "Risico- en protectieve factoren", "def": "Factoren op kind-, gezins- en omgevingsniveau die de kans op gedragsproblemen vergroten (risico) of verkleinen (beschermend)."}, {"term": "Een verstoring van het ecosysteem", "def": "Probleemgedrag wordt gezien als een verstoring van het evenwicht in het systeem rondom het kind (gezin, school, vrienden, omgeving)."}, {"term": "Begeleiding heeft als doel een blijvende verandering te brengen", "def": "problemen verminderen of hanteerbaar maken. Vroege preventie is cruciaal. Behandelingen waarvan de effectiviteit bewezen is, noemen we evidence-based."}, {"term": "Evidence-based behandelingen", "def": "Behandelingen waarvan uit studies blijkt dat ze leiden tot een positief en langdurig effect."}, {"term": "Gedragstherapeutische behandeling", "def": "Behandeling gebaseerd op de leertheorie, gericht op het actuele gedrag: te weinig of te veel gedrag als gevolg van verkeerde leerervaringen."}, {"term": "Opvoedingstheorie van Patterson", "def": "Theorie die de dynamiek tussen ouders en kinderen beschrijft. Vijf sleutelopvoedingsvaardigheden doorbreken negatieve interactiepatronen."}, {"term": "Sturende functies", "def": "Toezicht houden (supervisie) en discipline (leiding nemen): helpen grenzen te stellen."}, {"term": "Steunende functies", "def": "Positieve betrokkenheid, positieve bekrachtiging en samen problemen oplossen: bieden emotionele ondersteuning."}, {"term": "Geïntegreerde aanpak", "def": "Combinatie van meerdere strategieën die samen inspelen op zowel algemene als individuele behoeften van het kind."}, {"term": "Eerstegraadsstrategie", "def": "Creëer een veilig en positief leefklimaat als basis."}, {"term": "Tweedegraadsstrategie", "def": "Bied gerichte interventies die aansluiten bij de specifieke hulpvraag van het kind."}, {"term": "Derdegraadsstrategie", "def": "Stem de behandeling af op de unieke behoeften van het kind."}, {"term": "Centrale doelstelling van een multicausale benadering", "def": "De impact van risicofactoren verminderen en die van beschermende factoren versterken via interventies op kind-, gezins- en omgevingsniveau."}, {"term": "Herhalende en aanhoudende agressie", "def": "Tegenover zichzelf, anderen en goederen, in verschillende contexten (hulpverlening, school, gezin...)."}, {"term": "Ernstige automutilatie", "def": "Zelfbeschadiging als gedragskenmerk dat de GES+-doelgroep typeert."}, {"term": "Seksueel grensoverschrijdend gedrag", "def": "Een van de kernkenmerken die de toegang tot GES+-hulp rechtvaardigen."}, {"term": "Gedrag is altijd een signaal", "def": "Elk moeilijk gedrag heeft een signaalfunctie. Het is een uiting van een onderliggende nood of boodschap."}, {"term": "IJsbergtheorie van McClelland", "def": "Zichtbaar gedrag is het topje van de ijsberg. Het grootste deel (de oorzaken en drijfveren) zit onder water en is onzichtbaar voor de buitenwereld."}, {"term": "Gedragsproblemen zijn geen ontwikkelingsstoornissen", "def": "Bij ontwikkelingsstoornissen verloopt de ontwikkeling vertraagd of verstoord. Kinderen met ontwikkelingsstoornissen kunnen wel gedragsproblemen vertonen als gevolg hiervan."}, {"term": "Gedrags- en emotionele problemen zijn geen kinderpsychiatrische stoornissen", "def": "Gedragsstoornissen (zoals ODD) behoren wel tot de kinderpsychiatrie, gedrags- en emotionele problemen op zich niet."}, {"term": "Gedrags- en emotionele problemen hebben een link met opvoedingsproblemen", "def": "Probleemgedrag wordt vaak uitgelokt of versterkt door de omgeving. Soms is het beter te spreken van opvoedingsproblemen dan van gedragsproblemen."}], "Visuele Beperking": [{"term": "Oculaire aandoeningen", "def": "Aandoeningen van het oog zelf, met verminderde visus of gezichtsvelddefect."}, {"term": "Cerebrale visuele inperking (CVI)", "def": "Stoornis door een probleem in de oogzenuwen, gezichtsbanen of visuele hersenschors. Meest voorkomende vorm bij kinderen die prematuur geboren zijn. Diagnostiek is complex en vraagt een multidisciplinaire aanpak."}, {"term": "Visuele agnosie", "def": "Het verlies van het vermogen om aan visuele prikkels betekenis te verlenen en ze te herkennen. Oorzaak ligt in andere hersendelen."}, {"term": "Cerebrale visusstoornissen", "def": "Overkoepelende term voor stoornissen veroorzaakt door hersenproblemen. Aandacht hiervoor is sterk toegenomen door betere expertise in diagnose."}, {"term": "Congenitale of aangeboren oorzaken", "def": "Personen hebben van bij de start een verstoorde visuele waarneming. Erfelijke factoren, problemen tijdens zwangerschap of complicaties bij de geboorte spelen een rol."}, {"term": "Verworven oorzaken", "def": "Ontstaan door verwondingen, toxische stoffen, chronische ziekten, tumoren of neurologische aandoeningen. Meest voorkomend bij ouderen."}, {"term": "Persoonlijke verwerking", "def": "De verwerking van een visuele beperking is heel individueel. Het tijdstip en de snelheid van ontstaan zijn bepalende factoren. Resterend gezichtsvermogen optimaal benutten is een belangrijk orthopedagogisch aandachtspunt."}, {"term": "Twee aspecten staan centraal in de klassieke oftalmologische classificatie", "def": "gezichtsscherpte en gezichtsveld."}, {"term": "Gezichtsscherpte of visus", "def": "het vermogen om de kleinste details van objecten waar te nemen. Normaal zicht = 0,8 tot 1,2. Slechtziend = minder dan 0,3. Blind = minder dan 0,05 met het beste oog."}, {"term": "Confrontatietest", "def": "Screeningtest voor jongere kinderen waarbij een aantrekkelijk voorwerp in het gezichtsveld bewogen wordt om de grenzen ervan in te schatten."}, {"term": "In België en Nederland wordt de WHO-indeling gehanteerd", "def": "normaal ziend, voldoende voor autorijden, matig slechtziend, ernstig slechtziend, blind. Zowel gezichtsscherpte als gezichtsveld spelen een rol in de indeling."}, {"term": "Sociale communicatie", "def": "Veel kinderen met een visuele beperking maken een vertraging door in sociale communicatie. Dit kan wijzen op een bijkomende autismespectrumstoornis (ASS), maar differentiaaldiagnose is complex."}, {"term": "Neurocognitieve stoornissen", "def": "Bij ouderen met een visuele beperking is er een verhoogd risico op dementie en cognitieve achteruitgang."}, {"term": "Depressie en angst", "def": "Volwassenen met een visuele beperking ervaren twee keer zo vaak klachten van depressie en angst dan goedziende volwassenen. 64% geeft aan dat hun handicap een negatieve invloed heeft op hun welzijn."}, {"term": "Verstandelijke beperking", "def": "Bij kinderen met een verstandelijke beperking komt visuele comorbiditeit frequent voor. Bij aanvullende problematieken zoals epilepsie kan dit oplopen tot 70%."}, {"term": "Auditieve beperkingen", "def": "De combinatie van visuele en auditieve beperkingen (doofblindheid) wordt apart besproken in een ander hoofdstuk."}, {"term": "Functionele visuele efficiëntie", "def": "Het vermogen van een persoon om het resterende gezichtsvermogen in dagelijkse situaties in te zetten. Staat tegenover de functionele visuele beperkingen."}, {"term": "Proprioceptie", "def": "Het waarnemen van de positie van het eigen lichaam via signalen vanuit spieren en gewrichten."}, {"term": "Vestibulair systeem", "def": "Het evenwichtszintuig dat beweging, zwaartekracht en ruimtelijke oriëntatie waarneemt."}, {"term": "Interoceptie", "def": "Het waarnemen van de fysiologische toestand van het lichaam, zoals honger, dorst of hartslag."}, {"term": "Dominantie", "def": "De dominantie van het visuele zintuig is niet aangeboren, maar ontwikkelt zich gedurende het leven."}, {"term": "Andere zintuigen relatief sterker", "def": "Bij kinderen met een visuele beperking die vroeg ontstaat, compenseren gehoor, tast, reuk en smaak de ontbrekende visuele informatie."}, {"term": "Gezichtsresten", "def": "Resterend gezichtsvermogen dat altijd optimaal benut dient te worden, ook als het zeer beperkt is."}, {"term": "Ding- en vormhaptiek", "def": "Het gebruik van tast om objecten te verkennen en te begrijpen. Grote objecten worden deel voor deel getast en cognitief samengevoegd."}, {"term": "Beschermende functie van de haptiek", "def": "In de eerste levensjaren leidt aanraking vaak tot automatische terugtrekreactie. Dit is normaal gedrag."}, {"term": "Verkennende functie van de tast", "def": "Vanaf een ontwikkelingsleeftijd van 4 jaar komt de verkennende functie meer op de voorgrond."}, {"term": "Ruimtehaptiek", "def": "Verkenning van de omgeving via tast, proprioceptie en het vestibulair systeem. Geeft informatie over afstanden, posities en lichaamspositie."}, {"term": "Proprioceptie (in haptiek)", "def": "Essentieel bij ruimtehaptiek en bij het gebruik van een taststok om de omgeving te voelen."}, {"term": "Echolokalisatie", "def": "Techniek waarbij scherpe klikgeluiden gemaakt worden om via echo's obstakels te detecteren. Vraagt veel training en sterke proprioceptie."}, {"term": "Jonge kinderen – bewegen, exploratie en interactie", "def": "Visuele prikkels nodigen ziende kinderen uit tot bewegen en spelen. Bij kinderen met een visuele beperking ontbreekt deze stimulans, wat begeleiders en ouders moeten compenseren."}, {"term": "Sensorische afstemming en stimulatie", "def": "Jongeren met een visuele beperking rapporteren vaker sensorische overprikkeling of onderprikkeling. Goede afstemming in de begeleiding is nodig."}, {"term": "Zelfstimulatiegedrag", "def": "Gedrag zoals schommelen of ritmisch tikken als regulatiemechanisme bij blind geboren kinderen. Op zich niet problematisch, maar kan sociale interacties bemoeilijken."}, {"term": "Nieuwe omgevingen", "def": "Voor jongeren en volwassenen brengen nieuwe omgevingen verhoogde cognitieve belasting met zich mee. Ondersteuning bij verkenning is belangrijk."}, {"term": "Grove motoriek", "def": "Visuele prikkels motiveren ziende kinderen tot bewegen. Zonder dit ontwikkelen kinderen met een visuele beperking motorisch trager. Blinde baby's slaan regelmatig de kruipfase over."}, {"term": "Fijne motoriek", "def": "Ontbrekende visuele feedback beïnvloedt de fijne motoriek. Kinderen houden objecten vaak dicht bij het gezicht, wat een onnatuurlijke houding kan veroorzaken."}, {"term": "Sport- en bewegingsactiviteiten", "def": "Angst om te vallen en onzekerheid in open ruimtes leiden tot verminderde participatie aan sport en jeugdbewegingen."}, {"term": "Blindismen", "def": "Stereotiepe motorische gedragingen zoals hoofdwiegen of wiebelen bij blind of zwaar slechtziend geboren mensen. Ze zijn zelfregulerend of communicatief van aard en nemen toe bij stress."}, {"term": "Abstracte concepten", "def": "Visuele informatie helpt bij het begrijpen van abstracte begrippen, ruimtelijke oriëntatie en oorzaak-gevolgrelaties. Dit is moeilijker bij een visuele beperking."}, {"term": "Spontaan leren", "def": "Ziende kinderen leren spelenderwijs via observatie en imitatie. Kinderen met een visuele beperking missen deze visuele uitnodiging."}, {"term": "Objectpermanentie", "def": "Het besef dat een object blijft bestaan als het niet zichtbaar is. Ontwikkelt bij blinde kinderen later dan bij ziende kinderen."}, {"term": "Pragmatische communicatievaardigheden", "def": "Sociale regels in communicatie, gezichtsuitdrukkingen, lichaamstaal en oogcontact: allemaal visueel geladen. Kinderen met een visuele beperking missen dit."}, {"term": "Taalontwikkeling", "def": "Verloopt anders door het ontbreken van visuele prikkels zoals het zien van mondbewegingen en gezichtsuitdrukkingen."}, {"term": "Inhoudelijke taalontwikkeling", "def": "Gekoppeld aan cognitieve ontwikkeling. Kinderen gebruiken minder spontaan beschrijvende woorden voor visuele eigenschappen. Risico op 'zwevende taal'."}, {"term": "Verwarring met autismespectrumstoornissen", "def": "Uitgestelde echolalie en moeite met persoonlijke voornaamwoorden kunnen lijken op ASS-symptomen, maar hangen samen met de visuele beperking."}, {"term": "Afwijzing (als misinterpretatie)", "def": "Ouders kunnen de lichaamstaal van blinde of slechtziende baby's spontaan als afwijzing interpreteren. Het kind lacht minder, steekt handjes minder uit, richt het oor naar de ouder. Bewustwording hierover is essentieel."}, {"term": "Pikkelbaarheid", "def": "Heftige gevoelens van prikkelbaarheid bij blinde en slechtziende kleuters door extra inspanningen en ervaringen van falen."}, {"term": "Sociale interacties", "def": "Kinderen met een visuele beperking zijn vaak terughoudend in sociale interacties, zeker in nieuwe situaties. Begeleiding is een must."}, {"term": "Adolescentie", "def": "Jongeren met een visuele beperking moeten voor veel dagelijkse zaken rekenen op anderen, wat hun autonomieontwikkeling bedreigt."}, {"term": "Intieme relaties", "def": "In een partnerrelatie of gezin verandert er veel. Met open communicatie en ondersteuning kunnen relaties ook verdiepen."}, {"term": "Gericht op het voorkomen van het ontstaan van visuele stoornissen. Voorbeelden", "def": "prenatale opvolging, vaccinaties, sensibilisering over ooggezondheid, oogbescherming bij sport, gezonde levensstijl (diabetes voorkomen)."}, {"term": "Kind en Gezin", "def": "Organisatie die de vroege opsporing van verstoorde visuele ontwikkeling coördineert via systematische visusscreening bij jonge kinderen."}, {"term": "Visusscreening", "def": "Systematisch onderzoek om problemen in de visuele ontwikkeling vroeg op te sporen bij jonge kinderen."}, {"term": "Oogtest (Kind en Gezin)", "def": "Spoort factoren op die aanleiding geven tot amblyopie en ernstige oogafwijkingen. Wordt afgenomen op 12 en 30 maanden."}, {"term": "OLIVIA-vragenlijst", "def": "Screeningsinstrument voor volwassenen met een verstandelijke beperking om visuele problemen op te sporen. Ontwikkeld door Stijn vzw."}, {"term": "Medische interventie", "def": "Snelle medische behandeling na de diagnose kan veel betekenen voor de prognose."}, {"term": "Vroegbegeleiding", "def": "Ambulante en mobiele hulp (RTH) die ouders ondersteunt bij het verwerkingsproces, opvoeding, communicatie en stimulatie van het kind. Centra: Ganspoel vzw, De Kade – Begeleidingscentrum Spermalie, Licht en Liefde vzw."}, {"term": "Opvoedingsstress", "def": "Ernstige visuele beperking van een jong kind vormt een risico voor moederlijke opvoedingsstress, samenhangend met levend verlies, niet-vanzelfsprekende interacties en gevoelens van afwijzing."}, {"term": "Interactieproblemen", "def": "Problemen in de dagelijkse interactie tussen ouder en kind met een visuele beperking. Vroege ondersteuning is belangrijk om deze te voorkomen."}, {"term": "Video hometraining / video interactiebegeleiding", "def": "Methodes om de interactie tussen ouders en kind te verbeteren via videofeedback. Specifiek voor visuele beperking: de VIPP-V."}, {"term": "Vroegtijdige ontwikkelingsstimulering", "def": "In de voorschoolse fase gericht op alle ontwikkelingsgebieden: oriëntatie, mobiliteit, exploratie en communicatie."}, {"term": "Talrijke hulpmiddelen zijn beschikbaar dankzij technologische innovaties", "def": "brailleleesregels, schermvergroters, spraakcomputers en mobiliteitshulpmiddelen. Smartphones en laptops worden steeds vaker ingezet vanwege ingebouwde vergrotings- en spraakfuncties."}, {"term": "Tactiele bestrating", "def": "Patronen, verhoogde lijnen, noppen en texturen in bestrating die mensen met een visuele beperking waarschuwen voor veranderingen in het gebied."}, {"term": "Ribbeltegels", "def": "Tegels met lijnen die met een witte stok gevolgd kunnen worden als gidslijn."}, {"term": "Noppentegels", "def": "Tegels met bultjes als waarschuwing bij oversteekplaatsen, trappen en perrons."}, {"term": "Rubbertegels", "def": "Duiden bushaltes, koerswijzigingen of ingangen van belangrijke gebouwen aan."}, {"term": "Oriëntatiemateriaal en maquettes", "def": "Voelbare maquettes bij musea en gebouwen om de ruimte te verkennen."}, {"term": "Blindegeleidehond", "def": "Hulphond (meestal labrador of golden retriever) die de persoon begeleidt. Slechts circa 6% van de blinden en slechtzienden gebruikt een geleidehond."}, {"term": "In WZC De Waterdam werden aanpassingen gedaan zoals", "def": "audiofunctionaliteit op de website, vragen over slechtziendheid in vroegtijdige zorgplanning, aangepaste verlichting, grotere bewonersboekjes, aanpassing van activiteiten, en een optioneel symbool om slechtziendheid aan te geven."}, {"term": "De volledige bibliografie is terug te vinden in de originele cursus", "def": "Personen met een visuele beperking 2025-2026, auteurs Aicha Ajhnejh en Véronique Hendrickx, KDG Professionele bachelor orthopedagogie."}], "NBM 2025-2026": [{"term": "NBMV (Niet-begeleide minderjarige vreemdeling)", "def": "Officiële Belgische term: persoon jonger dan 18 jaar, afkomstig van buiten de EER, die zonder ouder of wettelijke voogd op Belgisch grondgebied verblijft. Bepaalt recht op voogd en opvang via Fedasil."}, {"term": "Niet-begeleid", "def": "Verwijst naar het ontbreken van ouders of een wettelijke voogd. Ook jongeren die reizen met een familielid (oom, tante, meerderjarige broer/zus) worden juridisch als niet-begeleid beschouwd, tenzij die persoon erkend is als wettelijke voogd."}, {"term": "Niet-begeleide minderjarige vluchteling", "def": "Nieuwe voorkeurterm die de cursus hanteert, in plaats van 'vreemdeling'. Legt minder nadruk op herkomst, meer op de situatie van vlucht."}, {"term": "NBM (Niet-begeleide minderjarige)", "def": "Term die hulpverleners steeds vaker gebruiken. De toevoeging 'vreemdeling' wordt weggelaten om de focus te leggen op het kind-zijn en de ontwikkelingsnoden, in lijn met het VN-Kinderrechtenverdrag."}, {"term": "Niet-begeleide Europese minderjarigen", "def": "Jongeren onder de 18 afkomstig uit een andere EER-lidstaat (bv. Roemenië, Bulgarije) of Zwitserland. Vallen buiten standaardprocedures voor NBM. Hebben vaak geen recht op internationale bescherming of opvang via Fedasil, tenzij er sprake is van veronachtzaming of risico op mensenhandel."}, {"term": "Verzoeker om internationale bescherming", "def": "Persoon (volwassene of minderjarige) die in België bescherming aanvraagt op basis van de Conventie van Genève (1951). Wordt tijdens de procedure officieel aangeduid als 'verzoeker'."}, {"term": "Subsidiair beschermde", "def": "Persoon die internationale bescherming krijgt, maar niet erkend wordt als vluchteling. Krijgt verblijfsrecht van 1 jaar (verlengbaar). Risico op schade is meer algemeen (bv. oorlog, genocide), niet persoonsgericht."}, {"term": "Erkende vluchteling", "def": "Persoon die voldoet aan de definitie van de Vluchtelingenconventie van Genève (1951): gegronde vrees voor vervolging op basis van ras, religie, nationaliteit, politieke overtuiging of geaardheid. Krijgt verblijfsrecht van 5 jaar (verlengbaar)."}, {"term": "Asielprocedure", "def": "Officieel: 'procedure betreffende het verzoek om internationale bescherming'. De stappen die een verzoeker doorloopt van aanvraag tot beslissing door het CGVS."}, {"term": "Raad Voor Vreemdelingenbetwistingen (RvV)", "def": "Orgaan waarbij een verzoeker schriftelijk in beroep kan gaan tegen negatieve beslissingen van het CGVS. De RvV kan beslissingen bevestigen, hervormen of vernietigen."}, {"term": "Verzoeker (voorkeurterm)", "def": "Nieuwe voorkeurterm boven 'asielzoeker'. Een NBM kan verzoeker zijn, maar hoeft dat niet (bv. bij humanitaire regularisatie of gezinshereniging)."}, {"term": "Beschermingsplicht", "def": "Wettelijke verplichting van België om NBM te beschermen en op te vangen, ongeacht of zij een verzoek om internationale bescherming indienen. Vloeit voort uit het IVRK (Internationaal Verdrag inzake de Rechten van het Kind)."}, {"term": "Dienst Voogdij", "def": "Wordt automatisch geactiveerd zodra een vermoedelijke NBM wordt gesignaleerd. Stelt een voogd aan als wettelijke vertegenwoordiger."}, {"term": "OOC (Observatie- en Oriëntatiecentrum)", "def": "Eerste opvangplaats voor NBM ter observatie. Na observatie worden jongeren doorverwezen naar Fedasil-netwerk of alternatieve opvangvormen."}, {"term": "LOI (Lokaal Opvanginitiatief)", "def": "Opvangvorm via OCMW voor jongeren die voldoende zelfstandig zijn (veelal 15+)."}, {"term": "Brede beschermingsplicht", "def": "Benadrukt dat NBM in de eerste plaats kinderen in een kwetsbare situatie zijn, en pas in tweede instantie migranten. Ongeacht verblijfsstatus hebben ze recht op zorg en begeleiding."}, {"term": "Transitmigrant", "def": "Term voor iemand die een land doorkruist op weg naar een andere bestemming. Reduceert een persoon tot een tijdelijke beweging en riskeert ontmenselijking."}, {"term": "Beleidsblindheid", "def": "Risico dat mensen die 'toch niet willen blijven' sneller uitgesloten worden van opvang, hulpverlening of bescherming, ook al bevinden ze zich in precaire omstandigheden."}, {"term": "Ontmenselijking", "def": "Het risico dat mensen enkel worden gezien via hun verblijfsstatus, waardoor hun menselijkheid en rechten over het hoofd worden gezien."}, {"term": "Transitpositie", "def": "Situatie waarbij mensen België of een ander Europees land tijdelijk doorkruisen met als doel ergens anders aan te komen (bv. VK). Zichtbaar in Calais, Zeebrugge, Brussel."}, {"term": "Mensen in transit (voorkeurterm)", "def": "Neutrale, mensgerichte alternatieve term voor 'transitmigrant'. Houdt het mensenrechtenperspectief centraal."}, {"term": "ICF (Internationale Classificatie van Functioneren, Beperking en Gezondheid)", "def": "Model van de WHO (2001) dat het functioneren van mensen in kaart brengt via gezondheidstoestand, lichaamsfuncties, activiteiten, participatie en contextuele factoren."}, {"term": "Bio-psycho-sociaal kader", "def": "Benadering waarbij beperkingen niet enkel voortkomen uit individuele aandoeningen, maar ook gevormd worden door de sociale en fysieke omgeving. Relevant voor het begrijpen van NBM."}, {"term": "Jaarlijks worden in België 1.000 tot 2.000 NBM geregistreerd. In 2024", "def": "3.981 meldingen, waarvan 1.522 erkend als minderjarig. Meeste jongeren komen uit Afghanistan, Syrië, Eritrea, Guinee en Palestina (16-17 jaar oud). Internationaal: 35,5 miljoen kinderen op de vlucht wereldwijd in 2020 (UNICEF)."}, {"term": "Co-morbiditeit", "def": "Het gelijktijdig voorkomen van meerdere psychische en/of somatische aandoeningen. NBM zijn een hoogrisicogroep door chronische stress, ontheemding, trauma en beperkte toegang tot basiszorg."}, {"term": "Hoogrisicogroep", "def": "Aanduiding voor NBM die een verhoogd risico lopen op zowel fysieke als psychische gezondheidsproblemen (PTSS, depressie, angststoornissen, slaapstoornissen, ondervoeding)."}, {"term": "Traumaresponsieve begeleiding", "def": "Begeleidingsaanpak die rekening houdt met de invloed van trauma op gedrag en welzijn, en inzet op herstel in plaats van symptoombestrijding."}, {"term": "Heterogene groep", "def": "NBM verschillen sterk in leeftijd, culturele achtergrond, taalniveau, migratietraject, draagkracht, opleidingsniveau, gezondheidstoestand en religieuze overtuiging."}, {"term": "Gedwongen migratie / gedwongen ontheemding", "def": "Migratie als gevolg van structurele factoren zoals oorlog, politieke instabiliteit, armoede, mensenrechtenschendingen, gebrek aan onderwijs of klimaatverandering. Mensen worden gedwongen, niet vrijwillig, te vertrekken."}, {"term": "Machtseconomie", "def": "Concept van Debruyne et al. (2024): verblijfspapieren zijn niet alleen administratie, maar deel van een systeem waarbij de overheid beslist wie rechten krijgt en wie niet. Het gaat om een verdeling van kansen gestuurd door machtsverhoudingen."}, {"term": "Vluchtelingverdrag van Genève (1951)", "def": "Internationaal kader waarbij mensen erkenning als vluchteling of subsidiair beschermde kunnen aanvragen op basis van risico's omwille van identiteit, ras, politieke overtuiging, geloofsovertuiging, geaardheid of meer algemene gevaren zoals oorlog of genocide."}, {"term": "VN Kinderrechtenverdrag (IVRK)", "def": "Belangrijk juridisch kader dat de fundamentele rechten van alle kinderen vastlegt, inclusief die van NBM: recht op bescherming, zorg en een passende levensstandaard."}, {"term": "EU-richtlijnen rond opvang- en asielprocedures", "def": "Europese richtlijnen die de voorwaarden voor opvang, toegang tot onderwijs en gezondheidszorg bepalen, en procedures voor de vaststelling van de minderjarigenstatus."}, {"term": "CGVS (Commissariaat-Generaal voor de Vluchtelingen en de Staatlozen)", "def": "Behandelt de asielaanvragen en beslist over erkenning als vluchteling of subsidiair beschermde."}, {"term": "Rechten van de NBM", "def": "Ongeacht verblijfsstatus heeft elke NBM recht op een voogd, onderwijs, opvang en medische zorg."}, {"term": "Atypische leefomgeving", "def": "NBM komen terecht in een atypische leefomgeving zoals opvangcentra. De werkelijke noden worden soms gekleurd door de visie van de organisatie en beleid. Begeleiding heeft niet altijd de tijd om individueel afgestemd te werken."}, {"term": "Andere mesoniveaufactoren", "def": "gebrek aan netwerk- en gezinscontext in land van aankomst, cultuurshock en aanpassingsmoeilijkheden."}, {"term": "Aangeleerde hulpeloosheid", "def": "Toestand waarbij mensen het gevoel hebben dat de oorzaak van alle feiten buiten henzelf ligt en dat ze geen invloed hebben op hun eigen leven. Ontstaat door gebrek aan controle. Kenmerkt zich in een overgang van boosheid en angst naar apathie. Heeft impact op creatief denken, oplossingen zoeken en leren. (Seligman & Maier, 1976)"}, {"term": "Veerkracht", "def": "Het proces waarbij iemand zich positief aanpast aan stress of tegenslag, waardoor het functioneren en mentale welbevinden behouden of herwonnen wordt door persoonlijke en externe hulpbronnen te mobiliseren. (Soyez et al., 2023)"}, {"term": "Veerkrachthuis", "def": "Model van Jan Van Gils (1999) dat veerkracht voorstelt als een huis met vijf bouwstenen: gedragenheid, zingeving, vaardigheden, eigenwaarde en humor. Helpt om veerkracht in kaart te brengen en te versterken."}, {"term": "Acculturatieproces", "def": "Het zoeken naar een evenwicht tussen het behouden van de eigen cultuur en het overnemen van elementen van de nieuwe samenleving. Vraagt cognitieve, emotionele en sociale aanpassing. (Berry, 1997)"}, {"term": "Assimilatie", "def": "Aanpassing waarbij de NBM zichzelf aanpast aan de dominante cultuur en elementen van de eigen cultuur (deels of volledig) loslaat."}, {"term": "Primaire preventie", "def": "Richt zich op het voorkomen dat jongeren genoodzaakt zijn alleen te migreren, door te werken aan veilige, stabiele leefomstandigheden in herkomstlanden en via internationale samenwerking."}, {"term": "Global Compact for Safe, Orderly and Regular Migration (GCM)", "def": "Internationaal pact (2018, 164 landen) dat erkent dat migratie vaak het gevolg is van structurele problemen. Geen juridisch bindend verdrag, maar een intentieverklaring."}, {"term": "Secundaire preventie", "def": "Zet in op het voorkomen van verdere schade zodra het probleem (de minderjarige is alleen gemigreerd) al aanwezig is. Begint bij aanmelding van de NBM. De Dienst Voogdij speelt een sleutelrol."}, {"term": "Tertiaire preventie", "def": "Richt zich op schadebeperking op lange termijn bij NBM die al in een kwetsbare situatie verkeren. Inzetten op herstel, duurzame participatie of begeleide, vrijwillige terugkeer."}, {"term": "Ondersteuning van NBM gaat verder dan medische zorg of juridische procedures", "def": "het gaat om een omgeving creëren waar jongeren opnieuw grip krijgen op hun leven, basisbehoeften erkend worden en veerkracht versterkt wordt."}, {"term": "Het veerkrachthuis", "def": "Metafoor van Jan Van Gils (1999) voor veerkracht als een huis met vijf bouwstenen: gedragenheid, zingeving, vaardigheden, eigenwaarde en humor. Biedt houvast in de begeleiding van kinderen en jongeren."}, {"term": "Window of tolerance / stressraam", "def": "Model van Dan Siegel (1999): het optimale spanningsgebied waarbinnen mensen goed kunnen functioneren, denken en voelen. Mensen met trauma hebben een smaller venster."}, {"term": "Optimale zone / tolerantiezone", "def": "De zone waarbij iemand, ook bij stress, reageert vanuit kalmte. Er is ruimte voor redeneren, leren, creativiteit en contact."}, {"term": "Hyperarousal", "def": "Eerste stressreactie: overprikkeling. Uit zich in angst, paniek, boosheid, impulsief gedrag, hogere alertheid. Lichaam staat in vecht- of vluchtreactie."}, {"term": "Hypoarousal", "def": "Tweede stressreactie: onderprikkeling. Uit zich in terugtrekken, verdoofd gevoel, apathie, passiviteit, dissociatie en vermoeidheid. Lichaam verkeert in bevriezingsreactie."}, {"term": "Co-regulatie", "def": "Manier om een kind of jongere uit de stressreactie te halen via een kalme, nabije volwassene die rust en veiligheid biedt. De begeleider blijft zelf kalm en vanuit die kalmte helpt hij het kind terugkeren naar de optimale zone."}, {"term": "Aangeleerde hulpeloosheid (herhaling in begeleidingscontext)", "def": "Chronische afhankelijkheid van externe actoren kan leiden tot aangeleerde hulpeloosheid. Begeleiding kan dit doorbreken door jongeren geleidelijk keuzes te laten maken."}, {"term": "Herstel van agency (eigenaarschap)", "def": "NBM het gevoel teruggeven dat hun eigen handelen een invloed heeft. Concreet: keuzes laten maken, doelen opstellen, betekenis geven aan gebeurtenissen. (Derluyn, 2022)"}, {"term": "NBM worden geconfronteerd met meervoudige verliezen", "def": "familie, thuis, vertrouwde taal, culturele codes en toekomstperspectieven. Dit veroorzaakt complexe rouwprocessen die zich uiten in teruggetrokken gedrag, regressie of psychosomatische klachten. Nabijheid en psycho-educatie zijn essentieel."}, {"term": "Complex trauma", "def": "Herhaalde, langdurige en relationeel ontwrichtende gebeurtenissen die leiden tot veranderingen in de neurologische ontwikkeling, met impact op het psychisch functioneren. NBM die opeenvolgende traumatische ervaringen meemaakten (pre-, tijdens en post-migratie) kunnen complex trauma ontwikkelen."}, {"term": "ACEs (Adverse Childhood Experiences)", "def": "Ingrijpende kind- en jeugdervaringen die de ontwikkeling ernstig kunnen beïnvloeden. Worden gecompenseerd door PACEs (beschermende kind- en jeugdervaringen)."}, {"term": "Psycho-educatie", "def": "Methodiek waarbij jongeren inzicht krijgen in hun gevoelens en leren dat verdriet, rouw en stress normale reacties zijn op abnormale situaties. Helpt angst, schuld en schaamte te reduceren en voorkomt overdiagnosticering."}, {"term": "OKAN-onderwijs (Onthaalklas voor Anderstalige Nieuwkomers)", "def": "Inburgeringscursus op maat van minderjarigen waarbij taalverwerving centraal staat. Meeste NBM volgen dit ca. 1 jaar voor doorstroom naar regulier onderwijs."}, {"term": "Leersteuncentra", "def": "Kunnen scholen begeleiden bij het integreren van leerlingen met bijkomende zorgnoden (o.a. NBM met psychosociale problematieken), since het decreet Leersteun (2023)."}, {"term": "Leercoaches / brugfiguren", "def": "Ondersteunen NBM op school en thuis bij huiswerk, leerproblemen en individueel aangepaste trajecten (IAC)."}, {"term": "CLB-medewerkers (Centrum voor Leerlingenbegeleiding)", "def": "Ondersteunen bij sociaal-emotionele vragen en helpen scholen bij het zoeken naar achterliggende problematieken."}, {"term": "Steunfiguren", "def": "Peters/meters, pleeggezinnen of andere vertrouwde volwassenen die een ondersteunende rol opnemen voor de NBM. Zijn een beschermende factor en dragen bij aan veerkracht."}, {"term": "Mentorprojecten", "def": "Initiatieven (bv. SAAMO, JES) die educatieve ondersteuning combineren met sociaal-emotionele begeleiding door vrijwilligers of professionals."}, {"term": "Campagne Steunfiguren", "def": "Roept burgers op om mentor of vertrouwenspersoon te worden voor kwetsbare jongeren zoals NBMV."}, {"term": "Buddywerkingen", "def": "Projecten waarbij vrijwilligers jongeren met een kwetsbare achtergrond ondersteunen. Focus op sociale integratie, taalverwerving en netwerkversterking."}, {"term": "Contact met peers", "def": "Sociale interactie met leeftijdsgenoten. Vaak beperkt bij NBM door taalbarrières, culturele verschillen en trauma. Groepsactiviteiten in opvangcentra proberen dit te stimuleren."}, {"term": "Toekomstoriëntering", "def": "Krachtgericht perspectief (Debosscher, 2014): het doel is niet alleen overleven, maar terug zin geven aan het eigen leven. Pijlers: erkenning, inzicht, reflectie en regie."}, {"term": "Ondersteuning vanuit toekomstoriëntering", "def": "Aanwezig zijn in de complexiteit van het dagelijks leven (rouw, trauma, dromen, krachten). Vraagt een coachende, niet sturende houding en het koesteren van hoop."}, {"term": "Collectieve opvang (Fedasil)", "def": "NBM verblijven in een groep van leeftijdsgenoten, met beperkte privacy en stabiliteit."}, {"term": "LOI's (Lokaal Opvanginitiatief)", "def": "Onder begeleiding van OCMW's. Focus op zelfstandig functioneren in het dagelijks leven."}, {"term": "Home for Children (Kinderen op de Vlucht)", "def": "Project waarbij NBM in gastgezinnen worden ondergebracht. Bevordert hechting, stabiliteit en individuele begeleiding."}, {"term": "Vluchtelingenwerk Vlaanderen", "def": "Organiseert sensibiliseringsacties en campagnes. Vrijwilligers kunnen zich engageren als buddy, huiswerkbegeleider of netwerkfiguur."}, {"term": "#EenWarmeThuis", "def": "Campagne van Agentschap Opgroeien gericht op alle jongeren in een kwetsbare leefsituatie, inclusief jongeren met migratieachtergrond."}, {"term": "Heterogene groep (herhaling)", "def": "NBM verschillen sterk in leeftijd, culturele achtergrond, taalniveau, migratietraject, psychische draagkracht en opleidingsniveau. Begeleiding moet hierop afgestemd zijn."}, {"term": "Juridisch-organisatorisch kader", "def": "De asielprocedure, voogdijregeling en opvangstructuren vormen samen het kader waarbinnen NBM hun leven in België starten."}, {"term": "Intersectorale samenwerking", "def": "Structurele samenwerking overheen verschillende sectoren (welzijn, onderwijs, justitie, jeugd, wonen) waarbij organisaties samenwerken rond gedeelde vragen bij NBM."}, {"term": "Frames en counterframes (vooruitwijzing)", "def": "Dominante beeldvorming (stigmatisering, stereotypering) vormt contextuele barrières voor NBM. Begeleiders hebben een rol als bondgenoot op micro-, meso- en macroniveau."}, {"term": "Dienst Vreemdelingenzaken (DVZ)", "def": "Verantwoordelijk voor het beheer van de toegang, het verblijf en de vestiging van vreemdelingen in België. Vaak het eerste aanspreekpunt voor NBM bij aankomst."}, {"term": "CGVS (herhaling)", "def": "Onderzoekt aanvragen voor internationale bescherming en beslist of een NBM erkend wordt als vluchteling of subsidiair beschermde. Via 'protection officers' wordt het vluchtverhaal onderzocht."}, {"term": "Protection officer", "def": "Medewerker van het CGVS die het vluchtverhaal van de jongere onderzoekt tijdens interviews of ondervragingen."}, {"term": "RHS-15 (Refugee Health Screener)", "def": "Screeningsinstrument voor vroegtijdige detectie van psychische klachten bij vluchtelingen. Intercultureel en laagdrempelig."}, {"term": "ORRA-model (Observatie, Reflectie, Registratie en Analyse)", "def": "Methodiek voor interculturele observatie en registratie bij NBM."}, {"term": "Na oriëntatie worden jongeren doorverwezen naar een aangepaste opvangstructuur", "def": "kleinschalige leefgroep, LOI of gespecialiseerd centrum. Focus op stabiliteit, schoolinschakeling, sociale integratie en mentale ondersteuning."}, {"term": "Specifieke opvangstructuren", "def": "opvang voor alleenstaande NBM-moeders (Rixensart), opvang voor NBM zonder asielaanvraag (Sugny), time-outprojecten (Sint-Truiden)."}, {"term": "Voogd (taken)", "def": "Begeleidt en vertegenwoordigt de NBM in juridische procedures (asielaanvraag). Ondersteunt bij huisvesting, onderwijs en medische zorg. Voogdij eindigt bij 18 jaar, verlaten van het land, adoptie of overlijden."}, {"term": "Integrale Jeugdhulp (IJH)", "def": "Vlaamse jeugdhulpstructuur waar NBM ook terecht kunnen. Toegang via de intersectorale toegangspoort (ITP) voor niet-rechtstreeks toegankelijke jeugdhulp (NRTJ) zoals pleegzorg, residentiële opvang of contextbegeleiding."}, {"term": "Intersectorale toegangspoort (ITP)", "def": "Provinciaal georganiseerde poortwachter die beslist over de toegang tot intensievere jeugdhulp."}, {"term": "Aanmeldpunten", "def": "Vier gespecialiseerde aanmeldpunten die ondersteuning bieden bij het inschatten van de hulpvraag voor NBM binnen de jeugdhulp: Minor-Ndako, Joba Vluchtelingenwerking (Kiosk), Fonto Nova (De Oever) en het OOC van Fedasil."}, {"term": "Dublin III-verordening", "def": "EU-regel die bepaalt dat het eerste Europese land van aankomst verantwoordelijk is voor de asielaanvraag. NBM die eerst in Italië of Griekenland aankwamen, riskeert teruggestuurd te worden naar dat eerste land."}, {"term": "Terugkeerhubs", "def": "Optie in het nieuwe Europees terugkeerbeleid om mensen over te brengen naar locaties buiten de EU, soms in gebieden met gekende mensenrechtenschendingen. Mensen zijn er minder beschermd door de wet en het EHRM."}, {"term": "Veel huidige voogden naderen de pensioenleeftijd. Gevolg", "def": "tekort aan voogden en meer wisselingen in continuïteit van begeleiding. Jongeren vallen tijdelijk zonder vaste voogd."}, {"term": "Project U-CARE (Unaccompanied Children in Alternative Residence)", "def": "Internationaal project (2021-2022) gecoördineerd door IOM om goede praktijken rond alternatieve opvang voor NBM uit te wisselen en te verbeteren."}, {"term": "Pleegouders van NBM hebben nood aan ondersteuning op meerdere domeinen", "def": "cultuursensitieve opvoeding, omgaan met trauma, juridische begeleiding en samenwerking met professionals. Pleegzorg Vlaanderen biedt hierin structurele ondersteuning."}, {"term": "Transculturele zorgcompetenties", "def": "Hulpverleners houden actief rekening met cultuur, religie, migratieverhaal en taal. Betekent 'anders kijken naar de relatie tussen mensen, context en betekenis', niet 'meer over culturen weten'."}, {"term": "Shared decision making (gedeelde besluitvorming)", "def": "Jongeren worden als volwaardige gesprekspartners erkend in beslissingen over hun eigen zorg en behandeling."}, {"term": "Multicausaliteit", "def": "Ruimte voor verschillende verklaringsmodellen naast elkaar (bv. psychologisch én spiritueel)."}, {"term": "Kosten en baten-frame", "def": "Dominant frame waarbij vluchtelingen gezien worden als economische last die de sociale zekerheid onder druk zet."}, {"term": "Onschuldige slachtoffer-frame", "def": "Frame dat empathie probeert op te wekken, maar onbedoeld uitsluitend kan werken: volwassen migranten worden impliciet als schuldig of gevaarlijk weggezet. Reduceert de cliënt tot een passief wezen."}, {"term": "Counterframes", "def": "Frames die het dominante verhaal doorbreken en een breder, menselijker beeld tonen. Bv. 'Wij zijn allemaal mensen' of het 'Winwin-frame' dat de talenten en bijdrage van jongeren benadrukt."}]};

const ICONS = {
  "Doelgroepen 3 - Deel 1": "🧠",
  "Doelgroepen 3 - Deel 2": "😤",
  "Visuele Beperking": "👁️",
  "NBM 2025-2026": "🌍"
};

const ROUND_SIZE = 10;
let currentSourceName = null;
let currentSourceData = [];

// ===== NAVIGATIE =====
function showScreen(id) {
  ['start-screen','mode-screen','match-screen','type-screen'].forEach(s => {
    const el = document.getElementById(s);
    if (el) {
      el.style.display = 'none';
      el.classList.remove('game-screen');
    }
  });
  const target = document.getElementById(id);
  if (target) {
    target.style.display = id === 'start-screen' || id === 'mode-screen' ? 'flex' : 'block';
  }
}

function goToStart() {
  showScreen('start-screen');
}

function goToMode() {
  showScreen('mode-screen');
}

// ===== STARTSCHERM =====
function buildStartScreen() {
  const container = document.getElementById('source-buttons');
  container.innerHTML = '';
  for (const [name, begrippen] of Object.entries(allSources)) {
    const btn = document.createElement('button');
    btn.className = 'source-btn';
    btn.innerHTML = `<div class="icon">${ICONS[name] || '📚'}</div><div>${name}</div><div class="count">${begrippen.length} begrippen</div>`;
    btn.addEventListener('click', () => selectSource(name));
    container.appendChild(btn);
  }
}

function selectSource(name) {
  currentSourceName = name;
  currentSourceData = allSources[name];
  document.getElementById('mode-title').textContent = name;
  document.getElementById('mode-subtitle').textContent = currentSourceData.length + ' begrippen beschikbaar';
  showScreen('mode-screen');
}

// ===== HULPFUNCTIES =====
function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function getRounds(data) {
  const shuffled = shuffle(data);
  const result = [];
  for (let i = 0; i < shuffled.length; i += ROUND_SIZE) {
    result.push(shuffled.slice(i, i + ROUND_SIZE));
  }
  return result;
}

// ===== KOPPELSPEL =====
let matchRounds = [];
let matchCurrentRound = 0;
let matchTotalCorrect = 0;
let matchRoundCorrect = 0;
let matchRoundData = [];
let matchSelectedLeft = null;
let matchSelectedRight = null;

function startMatchGame() {
  matchCurrentRound = 0;
  matchTotalCorrect = 0;
  document.getElementById('match-title').textContent = currentSourceName;
  document.getElementById('match-total').textContent = currentSourceData.length;
  matchRounds = getRounds(currentSourceData);
  showScreen('match-screen');
  buildMatchRound();
}

function buildMatchRound() {
  matchRoundData = matchRounds[matchCurrentRound];
  matchRoundCorrect = 0;
  matchSelectedLeft = null;
  matchSelectedRight = null;
  document.getElementById('svg-layer').innerHTML = '';
  document.getElementById('match-message').textContent = '';
  document.getElementById('match-next-btn').style.display = 'none';
  document.getElementById('match-correct').textContent = matchTotalCorrect;
  document.getElementById('match-round-info').textContent =
    'Ronde ' + (matchCurrentRound + 1) + ' van ' + matchRounds.length +
    ' (' + matchRoundData.length + ' begrippen)';
  updateMatchProgress();

  const shuffledDefs = shuffle(matchRoundData.map((d, i) => ({ ...d, origIndex: i })));
  const leftCol = document.getElementById('left-col');
  const rightCol = document.getElementById('right-col');
  leftCol.innerHTML = '';
  rightCol.innerHTML = '';

  matchRoundData.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.textContent = item.term;
    card.dataset.index = i;
    card.dataset.side = 'left';
    card.addEventListener('click', () => onMatchClick(card));
    leftCol.appendChild(card);
  });

  shuffledDefs.forEach((item) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.textContent = item.def;
    card.dataset.index = item.origIndex;
    card.dataset.side = 'right';
    card.addEventListener('click', () => onMatchClick(card));
    rightCol.appendChild(card);
  });
}

function onMatchClick(card) {
  if (card.classList.contains('correct')) return;
  const side = card.dataset.side;
  if (side === 'left') {
    if (matchSelectedLeft) matchSelectedLeft.classList.remove('selected');
    matchSelectedLeft = card;
    card.classList.add('selected');
  } else {
    if (matchSelectedRight) matchSelectedRight.classList.remove('selected');
    matchSelectedRight = card;
    card.classList.add('selected');
  }
  if (matchSelectedLeft && matchSelectedRight) checkMatchPair();
}

function checkMatchPair() {
  const li = parseInt(matchSelectedLeft.dataset.index);
  const ri = parseInt(matchSelectedRight.dataset.index);
  if (li === ri) {
    matchSelectedLeft.classList.remove('selected');
    matchSelectedRight.classList.remove('selected');
    matchSelectedLeft.classList.add('correct');
    matchSelectedRight.classList.add('correct');
    drawLine(matchSelectedLeft, matchSelectedRight, '#48bb78');
    matchRoundCorrect++;
    matchTotalCorrect++;
    document.getElementById('match-correct').textContent = matchTotalCorrect;
    updateMatchProgress();
    if (matchRoundCorrect === matchRoundData.length) {
      if (matchCurrentRound + 1 < matchRounds.length) {
        document.getElementById('match-message').textContent = 'Ronde voltooid! Goed bezig!';
        document.getElementById('match-next-btn').style.display = 'inline-block';
      } else {
        document.getElementById('match-message').textContent =
