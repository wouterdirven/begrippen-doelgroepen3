html = """<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Begrippenspel - Doelgroepen 3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f4f8; min-height: 100vh; padding: 20px; }
  h1 { text-align: center; color: #2d3748; margin-bottom: 8px; font-size: 1.4rem; }
  #score { text-align: center; color: #4a5568; margin-bottom: 12px; font-size: 0.95rem; }
  #round-info { text-align: center; color: #667eea; margin-bottom: 20px; font-size: 0.9rem; font-weight: bold; }
  #game-container { position: relative; display: flex; justify-content: space-between; gap: 40px; max-width: 900px; margin: 0 auto; }
  #svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .column { flex: 1; display: flex; flex-direction: column; gap: 10px; z-index: 1; }
  .card {
    background: white;
    border: 2px solid #cbd5e0;
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1.4;
    transition: border-color 0.2s, background 0.2s;
    user-select: none;
    min-height: 52px;
    display: flex;
    align-items: center;
  }
  .card:hover { border-color: #667eea; background: #ebf4ff; }
  .card.selected { border-color: #667eea; background: #ebf4ff; box-shadow: 0 0 0 3px #667eea55; }
  .card.correct { border-color: #48bb78; background: #f0fff4; pointer-events: none; }
  .card.wrong { border-color: #fc8181; background: #fff5f5; }
  #controls { text-align: center; margin-top: 24px; }
  button {
    background: #667eea;
    color: white;
    border: none;
    padding: 10px 28px;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    margin: 4px;
  }
  button:hover { background: #5a67d8; }
  #message { text-align: center; margin-top: 16px; font-size: 1.1rem; font-weight: bold; color: #2d3748; min-height: 28px; }
</style>
</head>
<body>
<h1>Begrippenspel - Doelgroepen 3</h1>
<p id="score">Score: <span id="correct-count">0</span> / <span id="total">29</span></p>
<p id="round-info"></p>
<div id="game-container">
  <svg id="svg-layer"></svg>
  <div class="column" id="left-col"></div>
  <div class="column" id="right-col"></div>
</div>
<div id="message"></div>
<div id="controls">
  <button onclick="nextRound()" id="next-btn" style="display:none">Volgende ronde</button>
  <button onclick="resetGame()">Opnieuw vanaf begin</button>
</div>

<script>
const allData = [
  { term: "Diversiteitsdenken", def: "Benadering die de nadruk legt op de meervoudige identiteiten van een persoon en hoe die identiteiten elkaar beinvloeden." },
  { term: "Kruispuntdenken", def: "Manier van denken over verschil, vertrekkend vanuit de samenhang van kenmerken zoals gender, etniciteit, klasse en seksualiteit." },
  { term: "Orthopedagogisch grondplan", def: "Kader dat hulpverleners helpt holistisch te kijken naar elk hulpverleningstraject, met afstemming tussen vraag en aanbod." },
  { term: "Tendensen", def: "Maatschappelijke stromingen die de orthopedagogische praktijk beinvloeden." },
  { term: "Dezelfde bril", def: "Holistische visie op mensen en hun context, waarbij verder gekeken wordt dan beperkingen of stoornissen." },
  { term: "ACEs", def: "Ingrijpende kind- en jeugdervaringen voor de leeftijd van 18 jaar met een duidelijke impact op de verdere ontwikkeling." },
  { term: "PACEs", def: "Beschermende en compenserende ervaringen die de veerkracht van kinderen versterken en de negatieve effecten van ACEs compenseren." },
  { term: "Het Kaiser onderzoek", def: "Baanbrekend onderzoek (1998) van Felitti en Anda naar de samenhang tussen ongunstige ervaringen in de kindertijd en de gezondheid als volwassene." },
  { term: "Problematische opvoedingssituatie (POS)", def: "Opvoedingssituatie die door betrokkenen als nagenoeg perspectiefloos wordt ervaren en waarbij men zonder externe hulp de situatie niet kan verbeteren." },
  { term: "Verontrustende opvoedingssituatie (VOS)", def: "Situatie waarbij de ontwikkelingskansen van een minderjarige bedreigd zijn of de integriteit van de minderjarige is aangetast." },
  { term: "Nadine Burke Harris", def: "Pionier in het onderzoek naar ACEs; richtte het Center for Youth Wellness op en verbond ACEs aan beleid en gezondheidszorg." },
  { term: "Piramidemodel van ACEs", def: "Model dat de mogelijke effecten van ACEs visualiseert, van vroege ervaringen tot sociale problemen, ziektes en vroeg overlijden." },
  { term: "Hartmodel van PACEs", def: "Model van Morris & Hays-Grudo dat het positieve effect van PACEs op gezondheid en ontwikkeling visualiseert via twee domeinen: steun en hulpbronnen." },
  { term: "Trauma", def: "Emotionele, fysieke of psychologische gevolgen van een ingrijpende gebeurtenis, ongeacht de leeftijd van de persoon." },
  { term: "Enkelvoudig trauma", def: "Eenmalige, onverwachte ingrijpende gebeurtenis met trauma als gevolg, zoals een ernstig verkeersongeval." },
  { term: "Meervoudig trauma", def: "Combinatie van verschillende ingrijpende gebeurtenissen in meerdere levensdomeinen met trauma als gevolg." },
  { term: "Kleine t trauma", def: "Dagelijkse negatieve ervaringen zoals pesten of discriminatie die door cumulatie traumatisch kunnen worden." },
  { term: "Complex trauma", def: "Meervoudig trauma waarbij de zorgfiguren betrokken zijn en het trauma verweven zit met de ontwikkelingstaken van het kind." },
  { term: "Ontwikkelingstrauma", def: "Meerdere chronische traumatische ervaringen, vaak vroeg in de ontwikkeling en van interpersoonlijke aard." },
  { term: "Protectieve factoren", def: "Factoren die het welzijn van een kind ondersteunen en de negatieve impact van ACEs verminderen." },
  { term: "Biologisch verklaringsmodel", def: "Model dat verklaart hoe en waarom ACEs diepe effecten hebben op hersenontwikkeling, sociaal-emotionele problemen en de algemene gezondheid." },
  { term: "Toxische stress", def: "Langdurige, extreme activatie van het stresssysteem zonder voldoende beschermende factoren, met schadelijke gevolgen voor hersenontwikkeling." },
  { term: "Center for Youth Wellness", def: "Organisatie opgericht door Nadine Burke Harris in San Francisco voor de aanpak van ACEs via onderzoek en hulpverlening." },
  { term: "Herstel", def: "Het proces waarbij kinderen en jongeren met ACEs, via goede begeleiding en PACEs, opnieuw kunnen functioneren en groeien." },
  { term: "Trauma-informed opvoedingsinterventies", def: "Opvoedingsprogrammas gericht op hoe ingrijpende ervaringen van verzorgers kunnen doorwerken in de opvoeding en het gezin." },
  { term: "Uitholling", def: "Risico waarbij begrippen zoals trauma, veerkracht of veiligheid te breed worden ingezet en hun specifieke betekenis verliezen." },
  { term: "Agency", def: "Het gevoel dat je eigen handelen invloed heeft op de situatie; centraal in veerkrachtherstel." },
  { term: "Veerkrachthuis", def: "Metafoor van Jan Van Gils die veerkracht voorstelt als een huis met vijf bouwstenen: gedragenheid, zingeving, vaardigheden, eigenwaarde en humor." },
  { term: "Belang van een netwerk", def: "Het belang van een sterk sociaal netwerk rondom kwetsbare kinderen en jongeren voor veerkracht en herstel." }
];

const ROUND_SIZE = 10;
let currentRound = 0;
let totalCorrect = 0;
let selectedLeft = null;
let selectedRight = null;
let roundCorrect = 0;
let currentData = [];
let rounds = [];

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function getRounds() {
  const shuffled = shuffle(allData);
  const result = [];
  for (let i = 0; i < shuffled.length; i += ROUND_SIZE) {
    result.push(shuffled.slice(i, i + ROUND_SIZE));
  }
  return result;
}

function buildGame() {
  currentData = rounds[currentRound];
  roundCorrect = 0;
  selectedLeft = null;
  selectedRight = null;
  document.getElementById('svg-layer').innerHTML = '';
  document.getElementById('message').textContent = '';
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('correct-count').textContent = totalCorrect;
  document.getElementById('round-info').textContent = 'Ronde ' + (currentRound + 1) + ' van ' + rounds.length + ' (' + currentData.length + ' begrippen)';

  const shuffledDefs = shuffle(currentData.map((d, i) => ({ ...d, origIndex: i })));
  const leftCol = document.getElementById('left-col');
  const rightCol = document.getElementById('right-col');
  leftCol.innerHTML = '';
  rightCol.innerHTML = '';

  currentData.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.textContent = item.term;
    card.dataset.index = i;
    card.dataset.side = 'left';
    card.addEventListener('click', () => onCardClick(card));
    leftCol.appendChild(card);
  });

  shuffledDefs.forEach((item) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.textContent = item.def;
    card.dataset.index = item.origIndex;
    card.dataset.side = 'right';
    card.addEventListener('click', () => onCardClick(card));
    rightCol.appendChild(card);
  });
}

function onCardClick(card) {
  if (card.classList.contains('correct')) return;
  const side = card.dataset.side;
  if (side === 'left') {
    if (selectedLeft) selectedLeft.classList.remove('selected');
    selectedLeft = card;
    card.classList.add('selected');
  } else {
    if (selectedRight) selectedRight.classList.remove('selected');
    selectedRight = card;
    card.classList.add('selected');
  }
  if (selectedLeft && selectedRight) checkMatch();
}

function checkMatch() {
  const li = parseInt(selectedLeft.dataset.index);
  const ri = parseInt(selectedRight.dataset.index);
  if (li === ri) {
    selectedLeft.classList.remove('selected');
    selectedRight.classList.remove('selected');
    selectedLeft.classList.add('correct');
    selectedRight.classList.add('correct');
    drawLine(selectedLeft, selectedRight, '#48bb78');
    roundCorrect++;
    totalCorrect++;
    document.getElementById('correct-count').textContent = totalCorrect;
    if (roundCorrect === currentData.length) {
      if (currentRound + 1 < rounds.length) {
        document.getElementById('message').textContent = 'Ronde voltooid!';
        document.getElementById('next-btn').style.display = 'inline-block';
      } else {
        document.getElementById('message').textContent = 'Alle 29 begrippen correct! Geweldig!';
      }
    }
  } else {
    selectedLeft.classList.add('wrong');
    selectedRight.classList.add('wrong');
    setTimeout(() => {
      selectedLeft.classList.remove('wrong', 'selected');
      selectedRight.classList.remove('wrong', 'selected');
      selectedLeft = null;
      selectedRight = null;
    }, 700);
    return;
  }
  selectedLeft = null;
  selectedRight = null;
}

function drawLine(leftCard, rightCard, color) {
  const svg = document.getElementById('svg-layer');
  const container = document.getElementById('game-container');
  const containerRect = container.getBoundingClientRect();
  const lRect = leftCard.getBoundingClientRect();
  const rRect = rightCard.getBoundingClientRect();
  const x1 = lRect.right - containerRect.left;
  const y1 = lRect.top + lRect.height / 2 - containerRect.top;
  const x2 = rRect.left - containerRect.left;
  const y2 = rRect.top + rRect.height / 2 - containerRect.top;
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', x2); line.setAttribute('y2', y2);
  line.setAttribute('stroke', color);
  line.setAttribute('stroke-width', '2.5');
  line.setAttribute('stroke-linecap', 'round');
  svg.appendChild(line);
}

function nextRound() {
  currentRound++;
  buildGame();
}

function resetGame() {
  currentRound = 0;
  totalCorrect = 0;
  rounds = getRounds();
  buildGame();
}

window.onload = resetGame;
window.addEventListener('resize', () => {
  document.getElementById('svg-layer').innerHTML = '';
});
</script>
</body>
</html>"""

with open('/root/output/index.html', 'w', encoding='utf-8') as f:
    f.write(html)
print("Klaar,", len(html), "tekens")
