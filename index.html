          'Alle ' + currentSourceData.length + ' begrippen correct! Geweldig!';
      }
    }
  } else {
    matchSelectedLeft.classList.add('wrong');
    matchSelectedRight.classList.add('wrong');
    setTimeout(() => {
      if (matchSelectedLeft) matchSelectedLeft.classList.remove('wrong','selected');
      if (matchSelectedRight) matchSelectedRight.classList.remove('wrong','selected');
      matchSelectedLeft = null;
      matchSelectedRight = null;
    }, 700);
    return;
  }
  matchSelectedLeft = null;
  matchSelectedRight = null;
}

function drawLine(leftCard, rightCard, color) {
  const svg = document.getElementById('svg-layer');
  const container = document.getElementById('match-game-container');
  const containerRect = container.getBoundingClientRect();
  const lRect = leftCard.getBoundingClientRect();
  const rRect = rightCard.getBoundingClientRect();
  const x1 = lRect.right - containerRect.left;
  const y1 = lRect.top + lRect.height / 2 - containerRect.top;
  const x2 = rRect.left - containerRect.left;
  const y2 = rRect.top + rRect.height / 2 - containerRect.top;
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', x2); line.setAttribute('y2', y2);
  line.setAttribute('stroke', color);
  line.setAttribute('stroke-width', '2.5');
  line.setAttribute('stroke-linecap', 'round');
  svg.appendChild(line);
}

function matchNextRound() { matchCurrentRound++; buildMatchRound(); }
function resetMatchGame() { matchCurrentRound = 0; matchTotalCorrect = 0; matchRounds = getRounds(currentSourceData); buildMatchRound(); }
function updateMatchProgress() {
  const pct = (matchTotalCorrect / currentSourceData.length) * 100;
  document.getElementById('match-progress').style.width = pct + '%';
}

window.addEventListener('resize', () => {
  document.getElementById('svg-layer').innerHTML = '';
});

// ===== INVULSPEL =====
let typeRounds = [];
let typeCurrentRound = 0;
let typeTotalCorrect = 0;
let typeRoundCorrect = 0;
let typeRoundData = [];
let typeRoundDone = 0;

function startTypeGame() {
  typeCurrentRound = 0;
  typeTotalCorrect = 0;
  document.getElementById('type-title').textContent = currentSourceName;
  document.getElementById('type-total').textContent = currentSourceData.length;
  typeRounds = getRounds(currentSourceData);
  showScreen('type-screen');
  buildTypeRound();
}

function buildTypeRound() {
  typeRoundData = typeRounds[typeCurrentRound];
  typeRoundCorrect = 0;
  typeRoundDone = 0;
  document.getElementById('type-message').textContent = '';
  document.getElementById('type-next-btn').style.display = 'none';
  document.getElementById('type-correct').textContent = typeTotalCorrect;
  document.getElementById('type-round-info').textContent =
    'Ronde ' + (typeCurrentRound + 1) + ' van ' + typeRounds.length +
    ' (' + typeRoundData.length + ' begrippen)';
  updateTypeProgress();

  const container = document.getElementById('type-game-container');
  container.innerHTML = '';

  typeRoundData.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'type-card';
    card.dataset.index = i;

    const defText = document.createElement('div');
    defText.className = 'def-text';
    defText.textContent = item.def;

    const inputRow = document.createElement('div');
    inputRow.className = 'input-row';

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'term-input';
    input.placeholder = 'Typ hier de term...';
    input.dataset.index = i;
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkTypeAnswer(i);
    });

    const checkBtn = document.createElement('button');
    checkBtn.className = 'check-btn';
    checkBtn.textContent = 'Controleer';
    checkBtn.addEventListener('click', () => checkTypeAnswer(i));

    const revealBtn = document.createElement('button');
    revealBtn.className = 'reveal-btn';
    revealBtn.textContent = 'Toon antwoord';
    revealBtn.addEventListener('click', () => revealTypeAnswer(i));

    inputRow.appendChild(input);
    inputRow.appendChild(checkBtn);
    inputRow.appendChild(revealBtn);

    const feedback = document.createElement('div');
    feedback.className = 'feedback-text';
    feedback.id = 'feedback-' + i;

    card.appendChild(defText);
    card.appendChild(inputRow);
    card.appendChild(feedback);
    container.appendChild(card);
  });
}

function normalizeAnswer(str) {
  return str.toLowerCase()
    .replace(/[\(\)]/g, '')
    .replace(/[àáâã]/g, 'a')
    .replace(/[èéêë]/g, 'e')
    .replace(/[ìíîï]/g, 'i')
    .replace(/[òóôõ]/g, 'o')
    .replace(/[ùúûü]/g, 'u')
    .replace(/[^a-z0-9 ]/g, '')
    .trim();
}

function checkTypeAnswer(i) {
  const card = document.querySelector('.type-card[data-index="' + i + '"]');
  if (card.classList.contains('correct') || card.classList.contains('revealed')) return;

  const input = card.querySelector('.term-input');
  const feedback = document.getElementById('feedback-' + i);
  const correctTerm = typeRoundData[i].term;
  const userAnswer = input.value;

  if (!userAnswer.trim()) return;

  const norm = normalizeAnswer(userAnswer);
  const normCorrect = normalizeAnswer(correctTerm);

  // Exacte match of de antwoord bevat de kernwoorden
  const isCorrect = norm === normCorrect ||
    normCorrect.includes(norm) && norm.length > 4 ||
    norm.includes(normCorrect);

  if (isCorrect) {
    card.classList.add('correct');
    feedback.className = 'feedback-text ok';
    feedback.textContent = 'Correct!';
    input.disabled = true;
    card.querySelectorAll('button').forEach(b => b.disabled = true);
    typeRoundCorrect++;
    typeTotalCorrect++;
    typeRoundDone++;
    document.getElementById('type-correct').textContent = typeTotalCorrect;
    updateTypeProgress();
    checkTypeRoundDone();
  } else {
    feedback.className = 'feedback-text fout';
    feedback.textContent = 'Niet juist, probeer opnieuw.';
    input.classList.add('wrong');
    setTimeout(() => input.classList.remove('wrong'), 600);
  }
}

function revealTypeAnswer(i) {
  const card = document.querySelector('.type-card[data-index="' + i + '"]');
  if (card.classList.contains('correct')) return;

  const input = card.querySelector('.term-input');
  const feedback = document.getElementById('feedback-' + i);
  const correctTerm = typeRoundData[i].term;

  card.classList.add('revealed');
  input.value = correctTerm;
  input.disabled = true;
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  feedback.className = 'feedback-text hint';
  feedback.textContent = 'Antwoord getoond.';
  typeRoundDone++;
  checkTypeRoundDone();
}

function checkTypeRoundDone() {
  if (typeRoundDone === typeRoundData.length) {
    if (typeCurrentRound + 1 < typeRounds.length) {
      document.getElementById('type-message').textContent = 'Ronde voltooid!';
      document.getElementById('type-next-btn').style.display = 'inline-block';
    } else {
      document.getElementById('type-message').textContent =
        typeRoundCorrect === typeRoundData.length
          ? 'Alle begrippen correct! Geweldig!'
          : 'Klaar! Je had ' + typeTotalCorrect + ' van de ' + currentSourceData.length + ' correct.';
    }
  }
}

function typeNextRound() { typeCurrentRound++; buildTypeRound(); }
function resetTypeGame() { typeCurrentRound = 0; typeTotalCorrect = 0; typeRounds = getRounds(currentSourceData); buildTypeRound(); }
function updateTypeProgress() {
  const pct = (typeTotalCorrect / currentSourceData.length) * 100;
  document.getElementById('type-progress').style.width = pct + '%';
}

// ===== START =====
buildStartScreen();
showScreen('start-screen');
</script>
